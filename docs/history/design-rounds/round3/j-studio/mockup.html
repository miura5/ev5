<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>E.V. v5 · J · Studio</title>
<!--
  E.V. v5 · round 3 · direction J "Studio": the Airbnb-modern midpoint between productivity and consumer UI.
  Synthetic study content only.
  File layout:
    1. <style>: tokens (light, dark), base, shell, the object language (one block per type), components, screens.
    2. <svg> sprite: UI icons (i-*) and type glyphs (g-*).
    3. Shell: sidebar, main area, detail sheet, palette, add-course dialog.
    4. <script>: data, object renderers (row / tile / link per type), screens, router, keys.
  Deep links: #today #today/item #library #set #study #exam #procedure #notes #course/nur112 #course/bio201
  #course/psy110 #course/new #ask #activity #proposal #palette #system #phone.  "\" toggles the theme.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ============ 1. Tokens ============ */
[data-theme="light"]{
  --bg:#FAF9F7; --side:#F2F0EC; --surface:#FFFFFF; --sunk:#F5F3EF; --hover:#F1EEEA; --sel:#EAE6E0;
  --line:#E9E5DF; --line2:#D8D3CB; --track:#ECE8E2;
  --text:#211F1C; --quiet:#56514A; --faint:#6D6860;
  --accent:#B4502A; --accent-hover:#9F4523; --on-accent:#FFFFFF; --accent-soft:#F8EBE4;
  --ok:#3B7D58; --ok-soft:#E5F0E9; --warn:#B07E22; --warn-soft:#F7EEDC; --bad:#B8503D; --bad-soft:#F8E7E3;
  /* type families (glyph tint + soft field) */
  --t-flash:#3D62A4; --t-flash-soft:#E9EEF7;
  --t-prac:#1E7479; --t-prac-soft:#E2F0F0;
  --t-mock:#75509A; --t-mock-soft:#F0EAF6;
  --t-proc:#8C5E16; --t-proc-soft:#F6EEDF;
  --t-note:#6D6860; --t-note-soft:#F0EDE8;
  /* course families (covers and swatches) */
  --c-nur:#4C7D62; --c-nur-soft:#E3EDE6;
  --c-bio:#A04E68; --c-bio-soft:#F4E5EA;
  --c-psy:#6C772F; --c-psy-soft:#EDEFDD;
  --c-new:#4F6C8F; --c-new-soft:#E4EAF2;
  --motif:.26;
  --shadow-hover:0 1px 2px rgba(33,31,28,.04),0 10px 28px rgba(33,31,28,.09);
  --shadow-pop:0 0 0 1px var(--line),0 24px 64px rgba(33,31,28,.18);
  --shadow-sheet:-1px 0 0 var(--line);
  --scrim:rgba(33,31,28,.28);
  --phone-body:#1B1A18;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#1C1B19; --side:#151413; --surface:#242321; --sunk:#201F1D; --hover:#2A2927; --sel:#33312E;
  --line:#302E2B; --line2:#3E3B37; --track:#35332F;
  --text:#EEEBE6; --quiet:#BDB7AE; --faint:#A19A90;
  --accent:#E58B65; --accent-hover:#EE9C79; --on-accent:#1E0F08; --accent-soft:#3A2A22;
  --ok:#74C095; --ok-soft:#1F3328; --warn:#DCB05E; --warn-soft:#3A3020; --bad:#E7826E; --bad-soft:#3D2522;
  --t-flash:#93B0EA; --t-flash-soft:#25303F;
  --t-prac:#72C4C8; --t-prac-soft:#1D3233;
  --t-mock:#BE9FE2; --t-mock-soft:#30283B;
  --t-proc:#DDB167; --t-proc-soft:#382E1F;
  --t-note:#AAA399; --t-note-soft:#2D2B28;
  --c-nur:#84B79A; --c-nur-soft:#22312A;
  --c-bio:#DC8EA6; --c-bio-soft:#3A2530;
  --c-psy:#B2BC6F; --c-psy-soft:#2F3221;
  --c-new:#97B0D2; --c-new-soft:#25303C;
  --motif:.30;
  --shadow-hover:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  --shadow-pop:0 0 0 1px var(--line2),0 24px 64px rgba(0,0,0,.55);
  --shadow-sheet:-1px 0 0 var(--line);
  --scrim:rgba(0,0,0,.5);
  --phone-body:#0C0C0B;
  color-scheme:dark;
}
:root{
  --sans:Inter,"Inter Variable",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* type scale: 12 meta · 13 label/chip · 15 body · 17 heading · 20 sheet title · 28 page title · 32 card face */
  --fs-xs:12px; --fs-sm:13px; --fs-md:15px; --fs-lg:17px; --fs-xl:20px; --fs-2xl:28px; --fs-face:32px;
  --lh:1.55; --lh-tight:1.25;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px; --sp-16:64px;
  --r-xs:6px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-pill:999px;
  --side-w:240px; --col:720px; --col-wide:920px; --sheet-w:408px;
  --row:44px; --ctl:36px; --ctl-lg:44px;
  --dur-1:120ms; --dur-2:180ms; --dur-3:320ms; --ease:cubic-bezier(.2,0,0,1);
}

/* ============ Base ============ */
*{box-sizing:border-box}
html,body{margin:0;background:var(--side);color:var(--text);font:400 var(--fs-md)/var(--lh) var(--sans);
  -webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss03";}
h1,h2,h3,h4,p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============ Shell ============ */
.app{display:grid;grid-template-columns:var(--side-w) 1fr;min-height:100vh}
.app.focus{grid-template-columns:1fr}
.app.focus .side{display:none}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:var(--sp-4) var(--sp-3);gap:2px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;height:36px;padding:0 var(--sp-2);font-weight:600;font-size:var(--fs-md);margin-bottom:var(--sp-2)}
.searchbtn{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:var(--sp-2);height:36px;padding:0 var(--sp-2) 0 var(--sp-3);margin-bottom:var(--sp-3);border-radius:var(--r-sm);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--faint);font-size:var(--fs-sm);cursor:pointer}
.searchbtn .kbd{margin-left:auto}
.nav{display:flex;align-items:center;gap:var(--sp-3);height:36px;padding:0 var(--sp-2) 0 10px;border-radius:var(--r-sm);color:var(--quiet);font-size:var(--fs-md);cursor:pointer}
.nav:hover{background:var(--hover);color:var(--text)}
.nav.on{background:var(--sel);color:var(--text);font-weight:500}
.nav .n{margin-left:auto;font-size:var(--fs-xs);color:var(--faint)}
.nav .n.need{min-width:20px;height:20px;border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent);font-weight:600;display:inline-grid;place-items:center;padding:0 6px}
.navgrp{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-6) var(--sp-2) var(--sp-1) 10px;font-size:var(--fs-xs);font-weight:600;color:var(--faint);letter-spacing:.02em}
.navgrp button{all:unset;cursor:pointer;display:grid;place-items:center;width:22px;height:22px;border-radius:var(--r-xs)}
.navgrp button:hover{background:var(--hover);color:var(--text)}
.nav.course{gap:10px}
.nav.course .code{font-weight:500;color:var(--text);white-space:nowrap}
.nav.course .nm{color:var(--faint);font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav.add{color:var(--faint);font-size:var(--fs-sm)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:var(--sp-4)}
.jobline{display:flex;align-items:center;gap:10px;padding:var(--sp-2) 10px;border-radius:var(--r-sm);font-size:var(--fs-sm);color:var(--quiet);cursor:pointer;line-height:1.35}
.jobline:hover{background:var(--hover)}
.jobline small{display:block;color:var(--faint);font-size:var(--fs-xs)}
.themebtn{all:unset;display:flex;align-items:center;justify-content:space-between;height:32px;padding:0 var(--sp-2) 0 10px;border-radius:var(--r-sm);color:var(--faint);font-size:var(--fs-sm);cursor:pointer}
.themebtn:hover{background:var(--hover)}

.area{margin:var(--sp-2) var(--sp-2) var(--sp-2) 0;background:var(--bg);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--line);min-height:calc(100vh - 16px);display:grid;grid-template-columns:1fr;min-width:0}
.app.focus .area{margin:0;border-radius:0;box-shadow:none;min-height:100vh}
.area.has-sheet{grid-template-columns:1fr var(--sheet-w)}
.main{min-width:0;padding:var(--sp-12) var(--sp-10) var(--sp-16)}
.col{max-width:var(--col);margin:0 auto}
.col.wide{max-width:var(--col-wide)}

/* page head */
.ph{display:flex;align-items:flex-end;gap:var(--sp-4);margin-bottom:var(--sp-6)}
.ph h1{font-size:var(--fs-2xl);font-weight:600;letter-spacing:-.02em;line-height:var(--lh-tight)}
.ph .sub{color:var(--faint);font-size:var(--fs-md);padding-bottom:3px}
.ph .grow{flex:1}
.crumbs{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--faint);margin-bottom:var(--sp-3)}
.crumbs a:hover{color:var(--text)}
.sec{margin-top:var(--sp-12)}
.sh{display:flex;align-items:baseline;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.sh h2{font-size:var(--fs-lg);font-weight:600;letter-spacing:-.01em}
.sh .n{color:var(--faint);font-size:var(--fs-sm)}
.sh .grow{flex:1}
.sh .lnk{font-size:var(--fs-sm);color:var(--quiet);cursor:pointer}
.sh .lnk:hover{color:var(--text)}
.meta{font-size:var(--fs-sm);color:var(--faint)}
.quiet{color:var(--quiet)}
.grow{flex:1;min-width:0}
.line{display:flex;align-items:center}
.g1{gap:var(--sp-1)}.g2{gap:var(--sp-2)}.g3{gap:var(--sp-3)}.g4{gap:var(--sp-4)}.g6{gap:var(--sp-6)}
.stack{display:flex;flex-direction:column}

/* ============ Components ============ */
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);height:var(--ctl);padding:0 14px;border-radius:10px;font-size:var(--fs-md);font-weight:500;color:var(--text);cursor:pointer;white-space:nowrap;transition:background var(--dur-1) var(--ease)}
.btn.primary{background:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{background:var(--accent-hover)}
.btn.primary .kbd{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--on-accent) 45%,transparent);color:var(--on-accent);opacity:.9}
.btn.secondary{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.secondary:hover{background:var(--hover)}
.btn.quiet{color:var(--quiet);padding:0 10px}
.btn.quiet:hover{background:var(--hover);color:var(--text)}
.btn.lg{height:var(--ctl-lg);padding:0 18px;border-radius:var(--r-md)}
.btn.sm{height:30px;padding:0 10px;font-size:var(--fs-sm);border-radius:var(--r-sm)}
.btn.icon{width:var(--ctl);padding:0}
.btn[disabled],.btn.is-disabled{background:var(--track);color:var(--faint);cursor:not-allowed;box-shadow:none}
.btn.is-focus{outline:2px solid var(--accent);outline-offset:2px}
.btn.is-hover.primary{background:var(--accent-hover)} .btn.is-hover.secondary{background:var(--hover)}
.kbd{display:inline-grid;place-items:center;height:20px;min-width:20px;padding:0 5px;border-radius:5px;box-shadow:inset 0 0 0 1px var(--line2);font:500 var(--fs-xs)/1 var(--sans);color:var(--faint)}

.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:var(--r-sm);box-shadow:inset 0 0 0 1px var(--line);background:var(--surface);font-size:var(--fs-sm);color:var(--quiet);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;cursor:pointer;vertical-align:middle}
.chip:hover{box-shadow:inset 0 0 0 1px var(--line2);color:var(--text)}
.chip svg.i{width:14px;height:14px}
.chip .tx{overflow:hidden;text-overflow:ellipsis}
.chip.plain{background:transparent;box-shadow:none;padding:0 4px;cursor:default}
.chip.unverified{border:1px dashed var(--line2);box-shadow:none;color:var(--faint);background:transparent}

.tabs{display:flex;gap:var(--sp-1);flex-wrap:wrap}
.tab{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:var(--sp-2);height:36px;padding:0 14px;border-radius:var(--r-pill);color:var(--quiet);font-size:var(--fs-md);cursor:pointer;box-shadow:inset 0 0 0 1px transparent}
.tab:hover{background:var(--hover);color:var(--text)}
.tab.on{background:var(--text);color:var(--bg);font-weight:500}
.tab .n{font-size:var(--fs-xs);opacity:.75}
.tab svg.i{width:15px;height:15px}
.utabs{display:flex;gap:var(--sp-6);border-bottom:1px solid var(--line)}
.utab{all:unset;cursor:pointer;height:40px;color:var(--quiet);font-size:var(--fs-md)}
.utab.on{color:var(--text);font-weight:500;box-shadow:inset 0 -2px 0 var(--text)}

.seg{display:inline-flex;padding:3px;gap:2px;border-radius:10px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{all:unset;cursor:pointer;white-space:nowrap;height:30px;padding:0 12px;border-radius:7px;font-size:var(--fs-sm);color:var(--quiet);display:inline-flex;align-items:center}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08),inset 0 0 0 1px var(--line2)}

.input{display:flex;align-items:center;gap:var(--sp-2);min-height:var(--ctl-lg);padding:0 var(--sp-4);border-radius:var(--r-md);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2);color:var(--text);font-size:var(--fs-md)}
.input input,.input textarea{all:unset;flex:1;min-width:0;font:inherit;color:var(--text)}
.input input::placeholder,.input textarea::placeholder{color:var(--faint)}
.input.focus{box-shadow:inset 0 0 0 1.5px var(--accent)}
textarea.ta{all:unset;box-sizing:border-box;display:block;width:100%;min-height:84px;padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2);font:inherit;line-height:var(--lh);color:var(--text);white-space:pre-wrap}

.check{width:18px;height:18px;border-radius:5px;box-shadow:inset 0 0 0 1.5px var(--line2);display:inline-grid;place-items:center;flex:none;background:var(--surface)}
.check.on{background:var(--text);box-shadow:none;color:var(--bg)}
.check.on svg.i{width:12px;height:12px;stroke-width:2.4}

/* meters */
.bar{display:flex;height:6px;border-radius:var(--r-pill);overflow:hidden;background:var(--track);gap:2px}
.bar i{display:block;height:100%}
.bar .m{background:var(--ok)} .bar .l{background:var(--warn)}
.pbar{height:4px;border-radius:var(--r-pill);background:var(--track);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--text);border-radius:inherit}
.pips{display:flex;gap:4px;align-items:center}
.pips i{width:8px;height:8px;border-radius:50%;background:var(--track)}
.pips i.y{background:var(--ok)} .pips i.x{background:var(--bad)} .pips i.w{background:var(--warn)}
.legend{display:flex;gap:var(--sp-4);font-size:var(--fs-xs);color:var(--faint)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}

.state{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:600;white-space:nowrap}
.state.need{background:var(--accent-soft);color:var(--accent)}
.state.run{background:var(--t-flash-soft);color:var(--t-flash)}
.state.done{background:var(--ok-soft);color:var(--ok)}
.state.fail{background:var(--bad-soft);color:var(--bad)}

/* ============ Object language ============ */
/* Type glyph: a soft rounded square in the type's family. Every library type and the note use it; nothing else does. */
.glyph{width:28px;height:28px;border-radius:var(--r-sm);display:inline-grid;place-items:center;flex:none}
.glyph svg.i{width:16px;height:16px}
.glyph.sm{width:22px;height:22px;border-radius:var(--r-xs)} .glyph.sm svg.i{width:13px;height:13px}
.glyph.lg{width:48px;height:48px;border-radius:var(--r-md)} .glyph.lg svg.i{width:22px;height:22px}
.ty-flash{--ty:var(--t-flash);--ty-soft:var(--t-flash-soft)}
.ty-prac{--ty:var(--t-prac);--ty-soft:var(--t-prac-soft)}
.ty-mock{--ty:var(--t-mock);--ty-soft:var(--t-mock-soft)}
.ty-proc{--ty:var(--t-proc);--ty-soft:var(--t-proc-soft)}
.ty-note{--ty:var(--t-note);--ty-soft:var(--t-note-soft)}
.glyph{background:var(--ty-soft);color:var(--ty)}
.ty-label{font-size:var(--fs-xs);font-weight:600;color:var(--ty);letter-spacing:.01em}
.chip.link svg.i{color:var(--ty)}

/* Course: a patterned swatch (small) and a patterned cover (large). */
.co-nur{--co:var(--c-nur);--co-soft:var(--c-nur-soft)}
.co-bio{--co:var(--c-bio);--co-soft:var(--c-bio-soft)}
.co-psy{--co:var(--c-psy);--co-soft:var(--c-psy-soft)}
.co-new{--co:var(--c-new);--co-soft:var(--c-new-soft)}
.sw{width:10px;height:10px;border-radius:3px;background:var(--co);flex:none;display:inline-block}
.sw.md{width:18px;height:18px;border-radius:5px;overflow:hidden;background:var(--co-soft);position:relative}
.sw.md svg{position:absolute;inset:0;width:100%;height:100%}
.cover{position:relative;overflow:hidden;background:var(--co-soft)}
.cover svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* E.V.'s mark: a dotted ring in the accent. Her voice is the mark + one line + sources; no bubble. */
.mark{width:16px;height:16px;border-radius:50%;border:2px dotted var(--accent);flex:none;display:inline-block}
.mark.lg{width:22px;height:22px}
.mark.run{animation:turn 6s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
.voice{display:flex;align-items:flex-start;gap:var(--sp-3);color:var(--quiet);font-size:var(--fs-md)}
.voice .mark{margin-top:4px}
.voice b{color:var(--text);font-weight:600}
.voice .srcs{display:inline-flex;gap:6px;flex-wrap:wrap;margin-left:4px;vertical-align:middle}

/* Plan item: a Linear row. Only plan items carry the status ring; properties sit under the title as chips. */
.ring{all:unset;box-sizing:border-box;width:18px;height:18px;border-radius:50%;border:1.6px solid var(--faint);flex:none;display:grid;place-items:center;cursor:pointer;margin-top:2px}
.ring:hover{border-color:var(--text)}
.ring.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ring.done svg.i{width:11px;height:11px;stroke-width:2.6}
.ring.prop{border-style:dashed}
.ring.half{background:conic-gradient(var(--warn) 0 50%,transparent 50%);border-color:var(--warn)}
.pi{display:flex;align-items:flex-start;gap:var(--sp-3);padding:var(--sp-3) var(--sp-3);margin:0 calc(-1 * var(--sp-3));border-radius:var(--r-md);cursor:pointer}
.pi:hover{background:var(--hover)}
.pi.sel{background:var(--sel)}
.pi .pt{font-size:var(--fs-md);font-weight:500;line-height:22px;display:flex;align-items:center;gap:var(--sp-2)}
.pi .props{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pi .props .chip{height:24px;font-size:var(--fs-xs);padding:0 8px}
.pi .when{font-size:var(--fs-sm);color:var(--faint);white-space:nowrap;line-height:22px}
.pi.done .pt{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line2)}
.pi.done .props{display:none}
.prio{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.prio i{width:3px;border-radius:1px;background:var(--line2)}
.prio i:nth-child(1){height:5px}.prio i:nth-child(2){height:8px}.prio i:nth-child(3){height:12px}
.prio.high i{background:var(--quiet)}
.planlist{display:flex;flex-direction:column;gap:2px}
.proposal{display:flex;align-items:center;gap:var(--sp-3);min-height:52px;padding:var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-3);margin:var(--sp-2) calc(-1 * var(--sp-3)) 0;border-radius:var(--r-md);border:1.5px dashed var(--line2);color:var(--quiet)}
.proposal b{color:var(--text);font-weight:500}

/* Exam: a date block. */
.dateb{width:48px;height:52px;border-radius:var(--r-md);box-shadow:inset 0 0 0 1px var(--line2);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.dateb small{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--accent)}
.dateb b{font-size:var(--fs-xl);font-weight:600;margin-top:4px}
.dateb.co{box-shadow:inset 0 3px 0 var(--co),inset 0 0 0 1px var(--line2)}
.exrow{display:flex;align-items:center;gap:var(--sp-4);padding:10px var(--sp-3);margin:0 calc(-1 * var(--sp-3));border-radius:var(--r-md);cursor:pointer}
.exrow:hover{background:var(--hover)}
.exrow .t{font-weight:500}
.exrow .rd{width:132px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}

/* Weak spot: a fraction with its pips. */
.wsrow{display:flex;align-items:center;gap:var(--sp-4);padding:10px var(--sp-3);margin:0 calc(-1 * var(--sp-3));border-radius:var(--r-md)}
.wsrow:hover{background:var(--hover)}
.target{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn);flex:none}
.target svg.i{width:16px;height:16px}

/* Note: paper. Neutral page glyph, title + one-line excerpt + folder. No chips, no colour, no meter. */
.docrow{display:flex;align-items:flex-start;gap:var(--sp-3);padding:10px var(--sp-3);margin:0 calc(-1 * var(--sp-3));border-radius:var(--r-md);cursor:pointer}
.docrow:hover{background:var(--hover)}
.docrow.sel{background:var(--sel)}
.docrow .pg{width:22px;height:28px;flex:none;border-radius:3px 7px 3px 3px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2);position:relative;margin-top:1px}
.docrow .pg::before{content:"";position:absolute;left:5px;right:5px;top:9px;height:1.5px;background:var(--line2);box-shadow:0 4px 0 var(--line2),0 8px 0 var(--line2)}
.docrow .dt{font-weight:500;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.docrow .ex{font-size:var(--fs-sm);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:20px}

/* Library set row (search/course lists) */
.setrow{display:flex;align-items:center;gap:var(--sp-3);padding:10px var(--sp-3);margin:0 calc(-1 * var(--sp-3));border-radius:var(--r-md);cursor:pointer}
.setrow:hover{background:var(--hover)}
.setrow .st{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Tiles: browsable cards. Flat at rest, one soft shadow on hover. Each type adds its own face. */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 20px}
.tile{position:relative;display:flex;flex-direction:column;gap:var(--sp-3);height:224px;padding:18px 20px;border-radius:var(--r-lg);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;transition:box-shadow var(--dur-2) var(--ease)}
.tile:hover,.tile.is-hover{box-shadow:inset 0 0 0 1px var(--line),var(--shadow-hover)}
.tile .th{display:flex;align-items:center;gap:var(--sp-2)}
.tile .th .co-tag{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--faint);white-space:nowrap}
.tile .tt{font-size:16px;font-weight:600;line-height:1.35;letter-spacing:-.005em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .face{flex:1;min-height:0}
.tile .tf{display:flex;flex-direction:column;gap:8px;font-size:var(--fs-xs);color:var(--faint)}
.tile .tf .line{justify-content:space-between}
/* Flashcard set: a deck - two card edges peek out below (painted under the tile; the parent isolates). */
:has(> .tile.flash){isolation:isolate}
.tile.flash::before,.tile.flash::after{content:"";position:absolute;z-index:-1;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:0 0 var(--r-lg) var(--r-lg)}
.tile.flash::before{left:12px;right:12px;bottom:-6px;height:24px}
.tile.flash::after{left:24px;right:24px;bottom:-11px;height:24px;z-index:-2}
.tile.flash .count{font-size:var(--fs-sm);color:var(--quiet)}
/* Practice: the last attempt as pips. */
.tile.prac .pips i{width:10px;height:10px}
/* Mock exam: a ticket - stats above a perforation, notches at the edges. */
.tile.mock .ticket{display:flex;gap:var(--sp-5);align-items:baseline}
.tile.mock .ticket b{font-size:var(--fs-xl);font-weight:600}
.tile.mock .ticket span{font-size:var(--fs-xs);color:var(--faint);margin-left:4px}
.perf{position:relative;height:0;border-top:1.5px dashed var(--line2);margin:0 -20px}
.perf::before,.perf::after{content:"";position:absolute;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.perf::before{left:-9px;clip-path:inset(0 0 0 50%)}
.perf::after{right:-9px;clip-path:inset(0 50% 0 0)}
/* Procedure: a numbered ladder. */
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;position:relative}
.ladder li{display:flex;align-items:center;gap:10px;font-size:var(--fs-sm);color:var(--quiet);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.ladder li span.tx{overflow:hidden;text-overflow:ellipsis}
.ladder .nd{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ty);background:var(--ty-soft)}
.ladder li:not(:last-child)::after{content:"";position:absolute;left:9.5px;top:20px;height:6px;width:1px;background:var(--line2)}
.ladder li.more{color:var(--faint);font-size:var(--fs-xs);padding-left:30px}
.ladder li.more::after{display:none}
/* Note tile: a sheet of paper with lines. */
.tile.note{background:var(--surface)}
.tile.note .paper{flex:1;border-radius:var(--r-sm);background:repeating-linear-gradient(to bottom,transparent 0 13px,var(--line) 13px 14px);opacity:.9}
/* Course tile: cover on top. */
.tile.course{padding:0;overflow:hidden;gap:0}
.tile.course .cover{height:96px}
.tile.course .cb{padding:14px 18px;display:flex;flex-direction:column;gap:4px}
/* Job: E.V. is working. A sunk card with her mark and a step trail. */
.job{border-radius:var(--r-lg);background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);padding:var(--sp-5) var(--sp-6)}
.job .jh{display:flex;align-items:center;gap:var(--sp-3)}
.job .jt{font-weight:600;font-size:var(--fs-md)}
.job .jl{font-size:var(--fs-xs);color:var(--faint);font-weight:500}
.steps{list-style:none;margin:var(--sp-4) 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:flex;align-items:center;gap:var(--sp-3);font-size:var(--fs-sm);color:var(--quiet);min-height:28px;position:relative}
.steps li .s{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex:none}
.steps li.ok .s{background:var(--ok-soft);color:var(--ok)} .steps li.ok .s svg.i{width:11px;height:11px;stroke-width:2.6}
.steps li.now{color:var(--text);font-weight:500}
.steps li.now .s{box-shadow:inset 0 0 0 2px var(--t-flash);background:var(--surface)}
.steps li.now .s::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--t-flash)}
.steps li.wait{color:var(--text);font-weight:500}
.steps li.wait .s{box-shadow:inset 0 0 0 2px var(--accent);background:var(--surface)}
.steps li.wait .s::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.steps li.todo .s{box-shadow:inset 0 0 0 1.5px var(--line2)}
.steps li.err{color:var(--bad)} .steps li.err .s{background:var(--bad-soft);color:var(--bad)}
.steps li .r{margin-left:auto;font-size:var(--fs-xs);color:var(--faint);font-weight:400}
.job .jf{display:flex;align-items:center;gap:var(--sp-4);flex-wrap:wrap;margin-top:var(--sp-4);padding-top:var(--sp-4);border-top:1px solid var(--line);font-size:var(--fs-sm);color:var(--faint)}
.job.compact{padding:var(--sp-3) var(--sp-4);display:flex;align-items:center;gap:var(--sp-3)}
.tile.jobtile{background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line)}
.tile.jobtile .steps{margin-top:0}
.tile.jobtile .steps li{min-height:24px;font-size:var(--fs-xs)}
.tile.jobtile .steps li .s{width:16px;height:16px}

/* Resume ("Jump back in") cards */
.resume-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.resume{display:flex;gap:var(--sp-4);align-items:center;padding:var(--sp-4);border-radius:var(--r-lg);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;transition:box-shadow var(--dur-2) var(--ease);min-width:0}
.resume:hover{box-shadow:inset 0 0 0 1px var(--line),var(--shadow-hover)}
.resume .rt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.resume .rm{font-size:var(--fs-xs);color:var(--faint);margin:2px 0 8px}

/* Detail sheet (plan item) */
.sheet{position:sticky;top:0;height:calc(100vh - 16px);overflow:auto;border-left:1px solid var(--line);background:var(--surface);border-radius:0 var(--r-lg) var(--r-lg) 0;padding:var(--sp-5) var(--sp-6) var(--sp-8)}
.sheet .bar-top{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm);color:var(--faint);margin-bottom:var(--sp-5)}
.sheet h2{font-size:var(--fs-xl);font-weight:600;letter-spacing:-.01em;line-height:1.3}
.props-grid{display:grid;grid-template-columns:120px 1fr;row-gap:2px;margin-top:var(--sp-5)}
.props-grid .k{font-size:var(--fs-sm);color:var(--faint);height:34px;display:flex;align-items:center;gap:var(--sp-2)}
.props-grid .k svg.i{width:14px;height:14px}
.props-grid .v{height:34px;display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm);padding:0 var(--sp-2);margin-left:calc(-1 * var(--sp-2));border-radius:var(--r-sm);cursor:pointer;min-width:0;white-space:nowrap}
.props-grid .v:hover{background:var(--hover)}
.props-grid .v.add{color:var(--faint)}
.subtasks{display:flex;flex-direction:column;gap:2px;margin-top:var(--sp-2)}
.subtasks .st{display:flex;align-items:center;gap:var(--sp-3);height:34px;font-size:var(--fs-sm)}
.subtasks .st.done span{color:var(--faint);text-decoration:line-through}
.sheet .lbl{font-size:var(--fs-xs);font-weight:600;color:var(--faint);letter-spacing:.02em;margin-top:var(--sp-6)}
.divider{height:1px;background:var(--line);margin:var(--sp-5) 0}

/* Weekly review card */
.review{border-radius:var(--r-lg);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:var(--sp-5) var(--sp-6);display:flex;align-items:center;gap:var(--sp-8)}
.stat b{display:block;font-size:var(--fs-xl);font-weight:600;letter-spacing:-.01em}
.stat span{font-size:var(--fs-xs);color:var(--faint)}

/* Set page */
.set-head{display:flex;gap:var(--sp-6);align-items:flex-end}
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-3);margin-top:var(--sp-8)}
.mode{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:var(--sp-3);padding:14px var(--sp-4);border-radius:var(--r-md);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.mode:hover{box-shadow:inset 0 0 0 1px var(--line2);background:var(--hover)}
.mode b{display:block;font-weight:600;font-size:var(--fs-md)}
.mode span{display:block;font-size:var(--fs-xs);color:var(--faint)}
.mode .mi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);color:var(--quiet);flex:none}
.deck{position:relative;isolation:isolate;margin-top:var(--sp-8);perspective:1600px}
.deck::before,.deck::after{content:"";position:absolute;z-index:-1;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:0 0 var(--r-xl) var(--r-xl)}
.deck::before{left:18px;right:18px;bottom:-8px;height:30px}
.deck::after{left:36px;right:36px;bottom:-15px;height:30px;z-index:-2}
.fcard{position:relative;height:340px;transform-style:preserve-3d;transition:transform var(--dur-3) var(--ease);cursor:pointer}
.fcard.flipped{transform:rotateY(180deg)}
.fface{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r-xl);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;padding:var(--sp-5) var(--sp-6)}
.fface.back{transform:rotateY(180deg)}
.fface .fh{display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-xs);color:var(--faint);font-weight:500}
.fface .fb{flex:1;display:grid;place-items:center;text-align:center;padding:0 var(--sp-8)}
.fface .term{font-size:var(--fs-face);font-weight:600;letter-spacing:-.02em;line-height:1.2}
.fface .def{font-size:var(--fs-xl);line-height:1.5;color:var(--text);max-width:520px}
.carousel-nav{display:flex;align-items:center;justify-content:center;gap:var(--sp-5);margin-top:var(--sp-8)}
.circle-btn{all:unset;box-sizing:border-box;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line2);background:var(--surface);cursor:pointer}
.circle-btn:hover{background:var(--hover)}
.terms{border-radius:var(--r-lg);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.term-row{display:grid;grid-template-columns:200px 1fr 120px;gap:var(--sp-6);align-items:center;padding:14px var(--sp-6);border-top:1px solid var(--line)}
.term-row:first-child{border-top:0}
.term-row .tm{font-weight:600}
.term-row .df{font-size:var(--fs-sm);color:var(--quiet)}
.mast{display:flex;align-items:center;gap:var(--sp-2);justify-content:flex-end;font-size:var(--fs-xs);color:var(--faint)}
.mast .pips i{width:7px;height:7px}

/* Focus modes (study, exam, procedure) */
.focusbar{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr minmax(240px,420px) 1fr;align-items:center;gap:var(--sp-6);height:68px;padding:0 var(--sp-6);background:var(--bg);border-bottom:1px solid var(--line)}
.focusbar .fl{display:flex;align-items:center;gap:var(--sp-3);min-width:0}
.focusbar .fr{display:flex;align-items:center;gap:var(--sp-3);justify-content:flex-end}
.focusbar .ftitle{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.focusbar .fp{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:var(--fs-xs);color:var(--faint)}
.focusbar .fp .pbar{width:100%}
.fmain{max-width:760px;margin:0 auto;padding:var(--sp-10) var(--sp-6) var(--sp-16)}
.study-card{height:300px}
.attempt{margin-top:var(--sp-6)}
.attempt .lb{font-size:var(--fs-sm);color:var(--quiet);margin-bottom:var(--sp-2);display:flex;align-items:center;gap:var(--sp-2)}
.actions{display:flex;align-items:center;gap:var(--sp-3);margin-top:var(--sp-5)}
.actions .grow{flex:1}
.yours{margin-top:var(--sp-4);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);background:var(--sunk);font-size:var(--fs-sm);color:var(--quiet);text-align:left}
.yours b{color:var(--text);font-weight:600}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);flex:1}
.rate .btn{height:52px;border-radius:var(--r-md);flex-direction:column;gap:0;font-weight:600}
.rate .btn small{font-size:var(--fs-xs);font-weight:400;opacity:.8}

/* Exam */
.exam-wrap{display:grid;grid-template-columns:220px 1fr;gap:var(--sp-10);max-width:1040px;margin:0 auto;padding:var(--sp-10) var(--sp-8) var(--sp-16)}
.navgrid{display:grid;grid-template-columns:repeat(5,32px);gap:6px}
.navgrid button{all:unset;box-sizing:border-box;width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;font-size:var(--fs-xs);color:var(--faint);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.navgrid button.a{background:var(--sel);color:var(--text);box-shadow:none}
.navgrid button.cur{box-shadow:inset 0 0 0 2px var(--text);color:var(--text);font-weight:600}
.navgrid button.f{position:relative}
.navgrid button.f::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
.navgrid button.y{background:var(--ok-soft);color:var(--ok);box-shadow:none}
.navgrid button.x{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.qstem{font-size:var(--fs-xl);line-height:1.5;font-weight:500;letter-spacing:-.005em;margin-top:var(--sp-3)}
.opts{display:flex;flex-direction:column;gap:var(--sp-2);margin-top:var(--sp-6)}
.opt{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:var(--sp-4);min-height:56px;padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.opt:hover{box-shadow:inset 0 0 0 1px var(--line2)}
.opt .k{width:28px;height:28px;border-radius:var(--r-sm);display:grid;place-items:center;font-size:var(--fs-sm);font-weight:600;color:var(--quiet);box-shadow:inset 0 0 0 1px var(--line2);flex:none}
.opt.on{box-shadow:inset 0 0 0 2px var(--text)}
.opt.on .k{background:var(--text);color:var(--bg);box-shadow:none}
.opt.right{box-shadow:inset 0 0 0 2px var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:var(--surface);box-shadow:none}
.opt.wrong{box-shadow:inset 0 0 0 2px var(--bad)}
.opt.wrong .k{background:var(--bad);color:var(--surface);box-shadow:none}
.opt .tag{margin-left:auto;font-size:var(--fs-xs);font-weight:600}
.feedback{margin-top:var(--sp-6);padding:var(--sp-5) var(--sp-6);border-radius:var(--r-lg);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.feedback .fbh{display:flex;align-items:center;gap:var(--sp-3);font-weight:600}
.feedback p{margin-top:var(--sp-3);color:var(--quiet);line-height:1.6}
.feedback .srcs{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--sp-4)}
.hidden{display:none!important}

/* Procedure */
.proc-wrap{max-width:820px;margin:0 auto;padding:var(--sp-10) var(--sp-6) var(--sp-16)}
.slots{display:flex;flex-direction:column;gap:var(--sp-2);margin-top:var(--sp-5)}
.slot{display:flex;align-items:center;gap:var(--sp-4);min-height:52px;padding:var(--sp-2) var(--sp-4);border-radius:var(--r-md);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.slot .nd{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:var(--fs-sm);font-weight:600;background:var(--t-proc-soft);color:var(--t-proc);flex:none}
.slot .grip{color:var(--faint);margin-left:auto}
.slot.next{background:transparent;box-shadow:none;border:1.5px dashed var(--line2);padding:var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-4)}
.slot.next .nd{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2);color:var(--faint)}
.slot .res{white-space:nowrap;margin-left:auto;font-size:var(--fs-xs);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.slot.ok .res{color:var(--ok)}
.slot.moved{box-shadow:inset 0 0 0 1.5px var(--warn);background:var(--warn-soft)}
.slot.moved .res{color:var(--warn)}
.bank{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-4)}
.bank .chip{height:36px;padding:0 var(--sp-3);font-size:var(--fs-sm);color:var(--text);border-radius:10px}

/* Notes */
.notes{display:grid;grid-template-columns:288px 1fr;min-height:calc(100vh - 16px)}
.notes .pane{border-right:1px solid var(--line);padding:var(--sp-6) var(--sp-4)}
.notes .pane h3{font-size:var(--fs-xs);font-weight:600;color:var(--faint);letter-spacing:.02em;margin:0 var(--sp-2) var(--sp-2);display:flex;justify-content:space-between;align-items:center}
.folder{display:flex;align-items:center;gap:10px;height:34px;padding:0 var(--sp-2);border-radius:var(--r-sm);font-size:var(--fs-sm);color:var(--quiet);cursor:pointer}
.folder:hover{background:var(--hover)}
.folder.on{background:var(--sel);color:var(--text);font-weight:500}
.folder .n{margin-left:auto;font-size:var(--fs-xs);color:var(--faint);font-weight:400}
.folder svg.i{width:15px;height:15px;color:var(--faint)}
.notes .docs{margin-top:var(--sp-6);padding-top:var(--sp-5);border-top:1px solid var(--line)}
.notes .docs .dt{white-space:normal}
.notes .docs .docrow{margin:0}
.editor{padding:var(--sp-4) var(--sp-12) var(--sp-16);min-width:0}
.sessbar > *{white-space:nowrap}
.sessbar{position:sticky;top:8px;z-index:4;display:flex;align-items:center;gap:var(--sp-3);height:48px;padding:0 var(--sp-2) 0 var(--sp-4);border-radius:var(--r-md);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line),0 4px 14px rgba(0,0,0,.04);font-size:var(--fs-sm)}
.sessbar .rec{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sessbar .tm{font-weight:600;font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:2px;margin:var(--sp-6) 0 0}
.toolbar button{all:unset;cursor:pointer;height:30px;min-width:30px;padding:0 8px;border-radius:var(--r-xs);display:inline-grid;place-items:center;font-size:var(--fs-sm);color:var(--faint);font-weight:600}
.toolbar button:hover{background:var(--hover);color:var(--text)}
.doc{max-width:640px;margin-top:var(--sp-4)}
.doc h1{font-size:var(--fs-2xl);font-weight:600;letter-spacing:-.02em;line-height:1.25}
.doc h2{font-size:var(--fs-lg);font-weight:600;margin:var(--sp-6) 0 var(--sp-2)}
.doc p,.doc li{line-height:1.7;color:var(--text)}
.doc p{margin:var(--sp-2) 0}
.doc ul{margin:var(--sp-2) 0;padding-left:22px}
.doc li{margin:2px 0}
.doc .reading{clear:both;background:var(--accent-soft);border-radius:var(--r-xs);box-shadow:0 0 0 5px var(--accent-soft)}
.doc figure{float:right;width:220px;margin:4px 0 var(--sp-3) var(--sp-6);}
.doc figure .fig{border-radius:var(--r-md);background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);padding:var(--sp-3)}
.doc figcaption{font-size:var(--fs-xs);color:var(--faint);margin-top:6px}
.doc .cl{display:flex;align-items:center;gap:var(--sp-3);margin:6px 0;line-height:1.5}
.doc .cl.done span{color:var(--faint);text-decoration:line-through}
.evcheck{clear:both;margin-top:var(--sp-8);padding:var(--sp-5) var(--sp-6);border-radius:var(--r-lg);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.saved{display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--faint)}

/* Course page */
.course-cover{height:176px;border-radius:var(--r-lg)}
.course-id{display:flex;align-items:flex-start;gap:var(--sp-5);padding:0 var(--sp-6);position:relative}
.course-id .badge{margin-top:-36px;flex:none}
.course-id .ctx{padding-top:14px}
.course-id .btn{margin-top:22px}
.course-id .badge{width:72px;height:72px;border-radius:var(--r-lg);background:var(--surface);box-shadow:0 0 0 4px var(--bg),inset 0 0 0 1px var(--line);display:grid;place-items:center;overflow:hidden}
.course-id .badge .sw.md{width:44px;height:44px;border-radius:var(--r-md)}
.mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-3)}
.mini{display:flex;gap:var(--sp-3);align-items:center;padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;min-width:0;transition:box-shadow var(--dur-2) var(--ease)}
.mini:hover{box-shadow:inset 0 0 0 1px var(--line),var(--shadow-hover)}
.mini .mt{font-weight:600;font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mm{font-size:var(--fs-xs);color:var(--faint)}
.mini.flash{box-shadow:inset 0 0 0 1px var(--line),0 3px 0 -1px var(--surface),0 3px 0 0 var(--line)}
.mini.mock{border-left:0}
.sub-h{font-size:var(--fs-xs);font-weight:600;color:var(--faint);letter-spacing:.02em;margin:var(--sp-5) 0 var(--sp-2);display:flex;align-items:center;gap:var(--sp-2)}

/* Ask */
.chat{display:flex;flex-direction:column;gap:var(--sp-8);padding-bottom:140px}
.msg.me{align-self:flex-end;max-width:72%;padding:var(--sp-3) var(--sp-4);border-radius:var(--r-lg) var(--r-lg) var(--r-xs) var(--r-lg);background:var(--sel);line-height:1.55}
.msg.her{display:flex;gap:var(--sp-3);max-width:92%}
.msg.her .mark{margin-top:4px}
.msg.her .body{line-height:1.65}
.msg.her .body p+p{margin-top:var(--sp-2)}
.msg .srcs{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--sp-3)}
.msg .who{font-size:var(--fs-xs);color:var(--faint);font-weight:600;margin-bottom:4px}
.composer{position:fixed;bottom:24px;left:calc(var(--side-w) + (100vw - var(--side-w)) / 2);transform:translateX(-50%);width:min(var(--col),calc(100vw - var(--side-w) - 80px));border-radius:var(--r-lg);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2),0 8px 30px rgba(0,0,0,.06);padding:var(--sp-3) var(--sp-3) var(--sp-3) var(--sp-5);display:flex;align-items:center;gap:var(--sp-3)}
.composer .ph-t{flex:1;color:var(--faint)}

/* Proposal */
.conf{display:flex;flex-direction:column;gap:2px;margin-top:var(--sp-3)}
.conf .cr{display:flex;align-items:center;gap:var(--sp-4);min-height:52px;padding:6px 0;border-top:1px solid var(--line)}
.conf .cr:first-child{border-top:0}
.cardbox{border-radius:var(--r-lg);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:var(--sp-5) var(--sp-6)}
.stepnum{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;background:var(--text);color:var(--bg);font-size:var(--fs-xs);font-weight:700;flex:none}
.stepnum.off{background:var(--track);color:var(--faint)}
.dashlist{border:1.5px dashed var(--line2);border-radius:var(--r-lg);padding:var(--sp-2) var(--sp-5)}
.dashlist .pi{margin:0 calc(-1 * var(--sp-2));padding:var(--sp-3) var(--sp-2)}
.actbar{display:flex;align-items:center;gap:var(--sp-3);margin-top:var(--sp-6)}

/* Palette */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:none}
.scrim.open{display:block}
.palette{position:fixed;top:96px;left:50%;transform:translateX(-50%);width:640px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-pop);z-index:21;display:none;overflow:hidden}
.palette.open{display:block}
.palette .pin{display:flex;align-items:center;gap:var(--sp-3);height:60px;padding:0 var(--sp-5);border-bottom:1px solid var(--line)}
.palette .pin input{all:unset;flex:1;font-size:var(--fs-lg);color:var(--text)}
.palette .pres{max-height:520px;overflow:auto;padding:var(--sp-2)}
.palette .pg{font-size:var(--fs-xs);font-weight:600;color:var(--faint);padding:var(--sp-3) var(--sp-3) var(--sp-1)}
.palette .pr{display:flex;align-items:center;gap:var(--sp-3);min-height:48px;padding:6px var(--sp-3);border-radius:var(--r-sm);cursor:pointer}
.palette .pr.on,.palette .pr:hover{background:var(--hover)}
.palette .pr .tl{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.palette .pr .sm{font-size:var(--fs-xs);color:var(--faint)}
.palette .pfoot{display:flex;gap:var(--sp-5);padding:var(--sp-3) var(--sp-5);border-top:1px solid var(--line);font-size:var(--fs-xs);color:var(--faint)}
.palette .pfoot span{display:inline-flex;gap:6px;align-items:center}

/* Add course dialog */
.dialog{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:520px;border-radius:var(--r-xl);background:var(--surface);box-shadow:var(--shadow-pop);z-index:21;display:none;overflow:hidden}
.dialog.open{display:block}
.dialog .cover{height:120px}
.dialog .db{padding:var(--sp-6)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:var(--sp-4)}
.field label{font-size:var(--fs-sm);font-weight:500;color:var(--quiet)}
.swpick{display:flex;gap:var(--sp-2)}
.swpick button{all:unset;cursor:pointer;width:44px;height:32px;border-radius:var(--r-sm);overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px var(--line)}
.swpick button.on{outline:2px solid var(--text);outline-offset:2px}

/* System page */
.sys{max-width:1200px;margin:0 auto;padding:var(--sp-12) var(--sp-8) var(--sp-16)}
.sys h2.sh2{font-size:var(--fs-xl);font-weight:600;margin:var(--sp-12) 0 var(--sp-4);letter-spacing:-.01em}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-5)}

.swgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--sp-3);margin-top:var(--sp-3)}
.swc{font-size:11px;color:var(--faint);line-height:1.3}
.swc i{display:block;height:40px;border-radius:var(--r-sm);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:6px}

.olang .orow{display:grid;grid-template-columns:150px 1fr 264px 210px;gap:var(--sp-6);align-items:center;padding:var(--sp-5) var(--sp-6);border-top:1px solid var(--line)}
.olang .orow:first-child{border-top:0}
.olang .ohead{font-size:var(--fs-xs);font-weight:600;color:var(--faint);padding-top:var(--sp-3);padding-bottom:var(--sp-3)}

.spec-row{display:flex;align-items:flex-end;gap:var(--sp-5);flex-wrap:wrap}
.spec-box{display:flex;flex-direction:column;gap:6px;font-size:var(--fs-xs);color:var(--faint);align-items:flex-start}

.phones{display:flex;gap:var(--sp-12);justify-content:center;align-items:flex-start;padding:var(--sp-8) var(--sp-6) var(--sp-12);background:var(--side);min-height:100vh}
.device{width:414px;padding:12px;border-radius:64px;background:var(--phone-body);box-shadow:0 30px 80px rgba(0,0,0,.18),inset 0 0 0 1px rgba(255,255,255,.08);flex:none}

.status .sic{display:flex;gap:6px;align-items:center}
.pscroll{flex:1;overflow:hidden;padding:0 20px}
.tabbar{flex:none;height:84px;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding-top:8px}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--faint);font-weight:500}
.tabbar a svg.i{width:22px;height:22px}
.tabbar a.on{color:var(--text)}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--text);opacity:.85}
.phead{display:flex;align-items:center;justify-content:space-between;margin:var(--sp-2) 0 var(--sp-3)}
.phead h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
.round-ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.hscroll{display:flex;gap:var(--sp-3);overflow:hidden;margin:0 -20px;padding:0 20px 4px}
.hscroll .resume{width:280px;flex:none;padding:14px}
.pills{display:flex;gap:6px;overflow:hidden;margin:0 -20px;padding:0 20px}
.pills .tab{height:34px;padding:0 13px;font-size:var(--fs-sm);flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.pills .tab.on{box-shadow:none}
.ptiles{display:flex;flex-direction:column;gap:22px;margin-top:var(--sp-4)}
.ptiles .tile{height:auto;padding:16px;gap:10px}
.study-phone .pscroll{display:flex;flex-direction:column;padding:0 20px 20px}
.study-phone .fcardp{position:relative;isolation:isolate;margin-top:var(--sp-4)}
.study-phone .fcardp::before,.study-phone .fcardp::after{content:"";position:absolute;z-index:-1;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:0 0 var(--r-xl) var(--r-xl)}

.study-phone .fcardp::after{left:28px;right:28px;bottom:-13px;height:24px;z-index:-2}

.caption{max-width:380px;font-size:var(--fs-sm);color:var(--quiet);margin-top:var(--sp-4);text-align:center}
.caption b{color:var(--text)}

    dots:`<pattern id="${id}" width="${24*k}" height="${24*k}" patternUnits="userSpaceOnUse"><circle cx="${6*k}" cy="${6*k}" r="${3*k}" style="${m}"/><circle cx="${18*k}" cy="${18*k}" r="${3*k}" style="${m}"/></pattern>`,
    waves:`<pattern id="${id}" width="${48*k}" height="${26*k}" patternUnits="userSpaceOnUse"><path d="M0 ${13*k} q${12*k} -${7*k} ${24*k} 0 t${24*k} 0" style="${s};stroke-width:${2.5*k}"/></pattern>`,
    arcs:`<pattern id="${id}" width="${36*k}" height="${36*k}" patternUnits="userSpaceOnUse"><path d="M0 ${36*k} a${30*k} ${30*k} 0 0 1 ${30*k} -${30*k}" style="${s};stroke-width:${3*k}"/><path d="M0 ${36*k} a${16*k} ${16*k} 0 0 1 ${16*k} -${16*k}" style="${s};stroke-width:${3*k}"/></pattern>`,
    grid:`<pattern id="${id}" width="${28*k}" height="${28*k}" patternUnits="userSpaceOnUse"><rect x="${4*k}" y="${4*k}" width="${10*k}" height="${10*k}" rx="${2*k}" style="${m}"/></pattern>`,
    stripes:`<pattern id="${id}" width="${16*k}" height="${16*k}" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="${5*k}" height="${16*k}" style="${m}"/></pattern>`,
  };
  return `<svg aria-hidden="true" preserveAspectRatio="none"><defs>${P[kind]}</defs><rect width="100%" height="100%" style="fill:var(--c-${v}-soft)"/><rect width="100%" height="100%" fill="url(#${id})"/></svg>`;
}

function tile(s){

}

    <div class="status"><span class="num">9:41</span><span class="sic">${ic("i-signal",'viewBox="0 0 20 14" style="width:18px;height:12px;stroke:none;fill:currentColor"')}<svg class="i" viewBox="0 0 26 14" style="width:26px;height:13px"><use href="#i-battery"/></svg></span></div>
    <div class="pscroll">
      <div class="line g3" style="margin-top:6px"><span class="round-ic">${ic("i-x")}</span><div class="grow" style="text-align:center"><div style="font-weight:600;font-size:var(--fs-sm)">Cardiac output terms</div><div class="meta num">8 of 24</div></div><span class="round-ic">${ic("i-sliders")}</span></div>
      <div class="pbar" style="margin-top:14px"><i style="width:33%"></i></div>
      <div class="fcardp"><div class="pface"><div class="line" style="justify-content:space-between;font-size:var(--fs-xs);color:var(--faint);font-weight:500"><span>Definition</span><span class="line g2">${sw("bio201")}BIO 201</span></div>
        <div style="text-align:center;margin:auto 0;padding:0 6px"><div class="meta" style="font-weight:600;margin-bottom:10px">PRELOAD</div><div style="font-size:var(--fs-xl);line-height:1.45">How far the ventricle is stretched at the end of filling; set mainly by venous return.</div></div>
        <div style="display:flex;justify-content:center">${linkChip("note","Ch 9 lecture · ¶4")}</div></div></div>
      <div class="yours" style="margin-top:28px"><b>Your try:</b> how much blood is in the ventricle before it squeezes.</div>
      <div style="margin-top:12px">${voice(`<span style="font-size:var(--fs-sm)">Close. The key word is <b>stretch</b>.</span>`)}</div>
      <div class="meta" style="margin-top:auto;text-align:center;margin-bottom:10px"><span style="color:var(--ok);font-weight:600">5</span> good · <span style="color:var(--warn);font-weight:600">2</span> again · 16 to go</div>
      <div class="rate" style="flex:none"><button class="btn secondary">Again<small>in a minute</small></button><button class="btn primary">Good<small>in 3 days</small></button></div>
    </div>
    <div style="height:34px;flex:none"></div>
    <div class="homebar"></div>
  </div></div><div class="caption"><b>Flashcard study on the phone.</b> He typed his try before the flip; the back carries its source; Again and Good sit under his thumb.</div></div>
</div>`;
};

/* ---------- Palette ---------- */
const PAL = [
  {g:"Sets", html:() => `${glyph("flash")}<div class="grow"><div class="tl">Cardiac output terms</div><div class="sm">Flashcards · 24 cards · BIO 201</div></div>`, k:"cardiac output terms flashcards", href:"#set"},
  {g:"Sets", html:() => `${glyph("prac")}<div class="grow"><div class="tl">Cardiac output calculations</div><div class="sm">Practice · 8 problems · BIO 201</div></div>${pips("yyyyxyyy")}`, k:"cardiac output calculations practice", href:"#exam"},
  {g:"Notes", html:() => `<span class="docrow" style="padding:0;margin:0;background:none"><span class="pg"></span></span><div class="grow"><div class="tl">Ch 9 lecture · cardiac output</div><div class="sm">Note · BIO 201 / Lectures · edited today</div></div>`, k:"ch 9 lecture cardiac output note", href:"#notes"},
  {g:"Plan", html:() => `<span class="ring" style="margin:0"></span><div class="grow"><div class="tl">Review cardiac output terms</div><div class="sm">Plan item · today 12:15 pm · 15m</div></div>${sw("bio201")}`, k:"review cardiac output terms plan", href:"#today/item"},
  {g:"Jobs", html:() => `<span class="mark run"></span><div class="grow"><div class="tl">Writing Exam 3 mock</div><div class="sm">Job · running · 28 of 40 · uses your cardiac output notes</div></div><span class="state run">Running</span>`, k:"exam 3 mock job cardiac", href:"#activity"},
  {g:"Weak spots", html:() => `<span class="target" style="width:28px;height:28px">${ic("g-target")}</span><div class="grow"><div class="tl">Afterload vs preload</div><div class="sm">Weak spot · BIO 201 · from Cardiac output terms</div></div><span class="meta num">3 of 6</span>`, k:"afterload preload weak cardiac", href:"#course/bio201"},
  {g:"Courses", html:() => `${swmd("bio201")}<div class="grow"><div class="tl">BIO 201 · Anatomy & Physiology</div><div class="sm">Course · Ch 9 cardiac output this week</div></div>`, k:"bio 201 anatomy cardiac course", href:"#course/bio201"},
];
function renderPalette(q){
  q = (q||"").toLowerCase().trim();
  const hits = PAL.filter(p => !q || q.split(/\s+/).every(w => p.k.includes(w)));
  let out = "", last = "";
  hits.forEach((p,i) => { if (p.g!==last){ out += `<div class="pg">${p.g}</div>`; last=p.g; } out += `<div class="pr ${i===state.pi?"on":""}" data-href="${p.href}">${p.html()}</div>`; });
  out += `<div class="pg">Ask E.V.</div><div class="pr" data-href="#ask"><span class="mark"></span><div class="grow"><div class="tl">“${q||"…"}”</div><div class="sm">Hand this to E.V. · she'll ask for your try first</div></div><span class="kbd">Tab</span></div>`;
  document.getElementById("pres").innerHTML = out;
}
function openPalette(q="cardiac"){ state.pi = 0; const i = document.getElementById("pq"); i.value = q; renderPalette(q); document.getElementById("palette").classList.add("open"); document.getElementById("scrim").classList.add("open"); setTimeout(()=>i.focus(),0); }
function closeOverlays(){ ["palette","scrim","dialog"].forEach(id => document.getElementById(id).classList.remove("open")); }

/* ---------- Add course dialog ---------- */
function openAddCourse(){
  const d = document.getElementById("dialog");
  d.innerHTML = `<div class="cover co-new">${pattern("new",1.2)}</div><div class="db">
    <h2 style="font-size:var(--fs-xl);font-weight:600">Add a course</h2><p class="meta" style="margin-top:4px">It gets its own page, a sidebar entry and a cover. Sets and notes can be filed under it.</p>
    <div style="display:grid;grid-template-columns:140px 1fr;gap:12px"><div class="field"><label>Code</label><div class="input"><input value="NUR 114"></div></div><div class="field"><label>Name</label><div class="input focus"><input value="Health Assessment"></div></div></div>
    <div class="field"><label>Cover</label><div class="swpick">${["new","nur","bio","psy"].map((v,i)=>`<button class="${i===0?"on":""}">${pattern(v,.6)}</button>`).join("")}</div></div>
    <div class="field"><label>Import from Canvas <span class="meta">· optional</span></label><div class="input"><input placeholder="Find the course in your Canvas list"></div></div>
    <div class="line g3" style="margin-top:24px"><span class="grow"></span><button class="btn quiet" data-act="close">Cancel</button><button class="btn primary">Add course <span class="kbd">↵</span></button></div></div>`;
  d.classList.add("open"); document.getElementById("scrim").classList.add("open");
}

/* ---------- Router ---------- */
const state = {lt:"all", lc:"all", ci:2, flip:false, sflip:false, pick:null, committed:false, pchecked:false, conf:{}, pi:0, sheet:false};
const FOCUS = ["study","exam","procedure","system","phone"];
function render(){
  const h = (location.hash.slice(1) || "today");
  const [base, sub] = h.split("/");
  const app = document.getElementById("app"), area = document.getElementById("area"), main = document.getElementById("main");
  closeOverlays();
  app.classList.toggle("focus", FOCUS.includes(base));
  state.sheet = (base==="today" && sub==="item");
  let html;
  if (base==="course") html = sub==="new" ? S.course("nur112") : S.course(sub);
  else if (base==="palette") html = S.today();
  else html = (S[base] || S.today)();
  main.innerHTML = html;
  main.style.padding = FOCUS.includes(base) || base==="notes" ? "0" : "";
  const old = area.querySelector(".sheet"); if (old) old.remove();
  area.classList.toggle("has-sheet", state.sheet);
  if (state.sheet) area.insertAdjacentHTML("beforeend", S.sheet());
  document.querySelectorAll(".nav[data-nav]").forEach(n => n.classList.toggle("on", n.dataset.nav===(base==="palette"?"today":base) || (base==="set"&&n.dataset.nav==="library")));
  document.querySelectorAll(".nav.course").forEach(n => n.classList.toggle("on", base==="course" && n.dataset.course===sub));
  if (base==="palette") openPalette();
  if (base==="course" && sub==="new") openAddCourse();
  window.scrollTo(0, base==="ask" ? document.body.scrollHeight : 0);
}
function rerender(){ const y = window.scrollY; const h = location.hash; render(); window.scrollTo(0,y); }
document.getElementById("courseNav").innerHTML = Object.entries(COURSES).map(([id,c]) =>
  `<a class="nav course" data-course="${id}" href="#course/${id}">${swmd(id)}<span class="code">${c.code}</span><span class="nm">${c.name.split(" ")[0]}</span>${id==="nur112"?'<span class="n">Thu</span>':""}</a>`).join("");

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (a){
    const act = a.dataset.act;
    if (act==="theme") return toggleTheme();
    if (act==="palette") return openPalette("");
    if (act==="addcourse") return openAddCourse();
    if (act==="close") return closeOverlays();
    if (act==="flip"){ state.flip=!state.flip; document.querySelector(".fcard").classList.toggle("flipped", state.flip); return; }
    if (act==="next"||act==="prev"){ state.ci = (state.ci + (act==="next"?1:TERMS.length-1)) % TERMS.length; state.flip=false; return rerender(); }
    if (act==="sflip"){ state.sflip=true; return rerender(); }
    if (act==="next-card"){ state.sflip=false; return rerender(); }
    if (act==="commit"){ if(!state.pick) return; state.committed=true; return rerender(); }
    if (act==="pcheck"){ state.pchecked=!state.pchecked; return rerender(); }
  }
  const lt = e.target.closest("[data-lt]"); if (lt){ state.lt = lt.dataset.lt; return rerender(); }
  const lc = e.target.closest("[data-lc]"); if (lc){ state.lc = lc.dataset.lc; return rerender(); }
  const pk = e.target.closest("[data-pick]"); if (pk && !state.committed){ state.pick = pk.dataset.pick; return rerender(); }
  const cf = e.target.closest("[data-conf]"); if (cf){ const [i,j] = cf.dataset.conf.split(":").map(Number); state.conf[i]=j; return rerender(); }
  if (e.target.id==="scrim"){ closeOverlays(); if (location.hash==="#palette"||location.hash==="#course/new") history.replaceState(null,"","#today"); return; }
  const go = e.target.closest("[data-go]"); if (go){ location.hash = go.dataset.go; return; }
  if (e.target.closest("a,button,input,textarea")) return;
  const hr = e.target.closest("[data-href]"); if (hr){ location.hash = hr.dataset.href.slice(1); closeOverlays(); }
});
document.getElementById("pq").addEventListener("input", e => { state.pi=0; renderPalette(e.target.value); });
function toggleTheme(){
  const r = document.documentElement, d = r.dataset.theme==="dark" ? "light" : "dark";
  r.dataset.theme = d; document.getElementById("themeLabel").textContent = d==="dark" ? "Light theme" : "Dark theme";
}
document.addEventListener("keydown", e => {
  const typing = e.target.closest && e.target.closest("input,textarea");
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); openPalette(""); return; }
  if (e.key==="Escape"){ if (document.getElementById("palette").classList.contains("open")||document.getElementById("dialog").classList.contains("open")) return closeOverlays(); if (location.hash.startsWith("#today/")) location.hash="today"; return; }
  if (typing) return;
  if (e.key==="\\"){ e.preventDefault(); toggleTheme(); return; }
  const base = location.hash.slice(1).split("/")[0];
  if (base==="set" && e.key===" "){ e.preventDefault(); document.querySelector("[data-act=flip]").click(); }
  if (base==="set" && (e.key==="ArrowRight"||e.key==="ArrowLeft")) document.querySelector(`[data-act=${e.key==="ArrowRight"?"next":"prev"}]`).click();
  if (base==="study" && e.key===" "){ e.preventDefault(); state.sflip=true; rerender(); }
});
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
