<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>E.V. v5 · K · Campus</title>
<!--
  E.V. v5 · round 3 · direction K "Campus". Synthetic study content only.
  Courses are the spine (Slack channels); Today stays the cross-course home.
  Rule of the object language: SHAPE says what a thing is, COLOUR says which course it belongs to,
  ORANGE says E.V. or the one action on the screen.
  File layout: 1 tokens · 2 base · 3 shell · 4 objects · 5 screens · 6 system/phone · then the SVG glyph sprite,
  the shell markup, and one <script> (data → object renderers → screens → router → behaviour).
  Deep links: #today #item #ask #activity #library #notes #course/nur112 #course/nur112/plan
  #course/nur112/library #course/nur112/notes #course/nur112/notes/wk9 #course/nur112/exams #proposal
  #course/bio201 #add-course #set #study #practice #procedure #palette #system #phone
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* ============ 1 · Tokens ============ */
:root{
  --fs-meta:12px; --fs-body:14px; --fs-read:16px; --fs-title:20px; --fs-display:24px;
  --lh:1.5; --fw-med:500; --fw-title:600;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px; --sp-14:56px;
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:10px; --r-xl:12px; --r-pill:999px;
  --row:40px; --row-plan:44px; --col:720px; --col-wide:904px; --side-w:232px; --icon:16px;
  --dur-1:150ms; --dur-2:200ms; --dur-3:250ms; --ease:cubic-bezier(.2,0,0,1); --rise:4px;
  --sans:Inter,"Inter Variable",system-ui,-apple-system,"Segoe UI",sans-serif;
}
[data-theme="dark"]{
  --side:#121211; --bg:#181816; --surface:#1e1e1b; --raised:#242421; --hover:#272724; --sel:#2f2f2b;
  --line:#2f2f2a; --line2:#3d3c37;
  --text:#eeede9; --quiet:#b2b1aa; --faint:#91908a;
  --her:#e0743a; --on-her:#1a0d05;
  --ok:#57c38a; --warn:#d9aa48; --bad:#e8776e; --info:#7aa5f0;
  --c1:#a597e6; --c2:#62b89c; --c3:#6fa8dc; --c4:#d98fa9; --c5:#cdb06a; --c6:#9aa3ad;
  --tint:15%; --tint-2:24%;
  --scrim:rgba(0,0,0,.55); --sh-tile:none; --sh-pop:0 0 0 1px var(--line2),0 24px 60px rgba(0,0,0,.5);
  color-scheme:dark;
}
[data-theme="light"]{
  --side:#f3f2ee; --bg:#fbfaf7; --surface:#ffffff; --raised:#ffffff; --hover:#f0efea; --sel:#e8e6df;
  --line:#e7e5df; --line2:#d6d4cc;
  --text:#1d1c19; --quiet:#55544d; --faint:#6b6a63;
  --her:#b6541d; --on-her:#ffffff;
  --ok:#2a8f58; --warn:#ad7f0e; --bad:#c4473f; --info:#2f6fde;
  --c1:#6a58c8; --c2:#22856a; --c3:#2f74b5; --c4:#b4507a; --c5:#8f7016; --c6:#5f6b77;
  --tint:11%; --tint-2:18%;
  --scrim:rgba(30,26,16,.22); --sh-tile:0 1px 2px rgba(30,26,16,.05); --sh-pop:0 0 0 1px var(--line2),0 16px 40px rgba(30,26,16,.12);
  color-scheme:light;
}

/* ============ 2 · Base ============ */
html,body{height:100%;margin:0}
body{background:var(--side)}
.ev{background:var(--side);color:var(--text);font:var(--fs-body)/var(--lh) var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.ev *,.ev *::before,.ev *::after{box-sizing:border-box}
.ev a{color:inherit;text-decoration:none}
.ev h1,.ev h2,.ev h3,.ev p,.ev figure{margin:0}
.ev button,.ev input,.ev textarea{font:inherit;color:inherit}
.ev [hidden]{display:none !important}
.ev :focus{outline:none}
.ev :focus-visible{outline:2px solid var(--text);outline-offset:-2px}
.t-display{font-size:var(--fs-display);font-weight:var(--fw-title);letter-spacing:-.015em;line-height:1.25}
.t-title{font-size:var(--fs-title);font-weight:var(--fw-title);letter-spacing:-.01em;line-height:1.3}
.t-read{font-size:var(--fs-read);line-height:1.6}
.t-meta{font-size:var(--fs-meta);color:var(--faint)}
.t-label{font-size:var(--fs-meta);font-weight:var(--fw-med);color:var(--faint)}
.t-med{font-weight:var(--fw-med)}
.c-quiet{color:var(--quiet)} .c-faint{color:var(--faint)} .c-ok{color:var(--ok)} .c-bad{color:var(--bad)} .c-warn{color:var(--warn)}
.line{display:flex;align-items:center} .stack{display:flex;flex-direction:column}
.g1{gap:var(--sp-1)} .g2{gap:var(--sp-2)} .g3{gap:var(--sp-3)} .g4{gap:var(--sp-4)} .g6{gap:var(--sp-6)} .g8{gap:var(--sp-8)} .g12{gap:var(--sp-12)}
.grow{flex:1;min-width:0} .nowrap{white-space:nowrap} .ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:var(--icon);height:var(--icon);flex:none;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
@keyframes ev-fade{from{opacity:0}}
@keyframes ev-rise{from{opacity:0;transform:translateY(var(--rise))}}
@keyframes ev-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ev *,.ev *::before{animation:none !important;transition:none !important}}

/* ============ 3 · Shell: sidebar · area · panels ============ */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{flex:0 0 var(--side-w);padding:var(--sp-4) var(--sp-2) var(--sp-2);display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.ws{display:flex;align-items:center;gap:var(--sp-2);height:32px;padding:0 var(--sp-2);margin-bottom:var(--sp-2);font-weight:var(--fw-title)}
.search{display:flex;align-items:center;gap:var(--sp-2);height:32px;margin:0 0 var(--sp-3);padding:0 var(--sp-2);border-radius:var(--r-md);color:var(--faint);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.search:hover{box-shadow:inset 0 0 0 1px var(--line2);color:var(--quiet)}
.nav{display:flex;align-items:center;gap:10px;height:32px;padding:0 var(--sp-2);border-radius:var(--r-md);color:var(--quiet);cursor:pointer;transition:background-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
.nav:hover{background:var(--hover);color:var(--text)}
.nav.on{background:var(--sel);color:var(--text)}
.nav .n{margin-left:auto;font-size:var(--fs-meta);color:var(--faint)}
.nav.add{color:var(--faint)}
.navgrp{display:flex;align-items:center;justify-content:space-between;font-size:var(--fs-meta);font-weight:var(--fw-med);color:var(--faint);padding:var(--sp-6) var(--sp-2) var(--sp-1);height:52px}
.navgrp .btn.icon{width:24px;height:24px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.nav .sw{margin:0 3px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:var(--sp-4)}
.jobline{display:flex;align-items:center;gap:var(--sp-2);height:32px;padding:0 var(--sp-2);border-radius:var(--r-md);font-size:var(--fs-meta);color:var(--quiet);cursor:pointer}
.jobline:hover{background:var(--hover);color:var(--text)}
.area{flex:1;min-width:0;margin:var(--sp-2) var(--sp-2) var(--sp-2) 0;border-radius:var(--r-xl);background:var(--bg);display:flex;overflow:hidden;position:relative;box-shadow:0 0 0 1px var(--line)}
[data-theme="dark"] .area{box-shadow:none}
.page{flex:1;min-width:0;overflow-y:auto;animation:ev-fade var(--dur-1) var(--ease)}
.col{max-width:calc(var(--col) + 80px);margin:0 auto;padding:var(--sp-14) var(--sp-10) var(--sp-14);display:flex;flex-direction:column;gap:var(--sp-12)}
.col.wide{max-width:calc(var(--col-wide) + 80px)}
.phead{display:flex;align-items:center;gap:var(--sp-3);min-height:32px}
.phead .sub{font-size:var(--fs-meta);color:var(--faint);margin-top:2px}
.sec{display:flex;flex-direction:column}
.sec-head{display:flex;align-items:center;gap:var(--sp-2);min-height:32px;margin-bottom:var(--sp-2)}
.sec-head .more{margin-left:auto;font-size:var(--fs-meta);color:var(--faint);cursor:pointer}
.sec-head .more:hover{color:var(--text)}
.crumb{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-meta);color:var(--faint)}
.crumb a{cursor:pointer} .crumb a:hover{color:var(--text)}
.crumb .sep{opacity:.6}

/* Buttons, keys, chips, fields */
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);height:32px;padding:0 var(--sp-3);border-radius:var(--r-md);font-size:var(--fs-body);font-weight:var(--fw-med);color:var(--text);cursor:pointer;white-space:nowrap;transition:background-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
.btn:hover{background:var(--hover)}
.btn:focus-visible{outline:2px solid var(--text);outline-offset:1px}
.btn.primary{background:var(--her);color:var(--on-her)}
.btn.primary:hover{background:var(--her);filter:brightness(1.07)}
.btn.secondary{box-shadow:inset 0 0 0 1px var(--line2)}
.btn.text{color:var(--quiet);padding:0 var(--sp-2)}
.btn.text:hover{color:var(--text)}
.btn.icon{width:32px;padding:0}
.btn.lg{height:40px;padding:0 var(--sp-4)}
.btn:disabled,.btn.is-disabled{opacity:1;background:none;color:var(--faint);box-shadow:inset 0 0 0 1px var(--line);cursor:default;filter:none}
.kbd{display:inline-flex;align-items:center;justify-content:center;height:18px;min-width:18px;padding:0 var(--sp-1);border-radius:var(--r-xs);box-shadow:inset 0 0 0 1px var(--line2);font:var(--fs-meta)/1 var(--sans);color:var(--faint);flex:none}
.btn .kbd{margin-right:-4px}
.btn.primary .kbd{color:var(--on-her);box-shadow:inset 0 0 0 1px currentColor;opacity:.6}
.btn:disabled .kbd{color:var(--faint);opacity:1;box-shadow:inset 0 0 0 1px var(--line2)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 var(--sp-2);border-radius:var(--r-sm);font-size:var(--fs-meta);color:var(--quiet);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap;flex:none;max-width:220px}
.chip > span{overflow:hidden;text-overflow:ellipsis}
.chip .ic{width:14px;height:14px;color:var(--c,var(--faint))}
.chip .sw{width:8px;height:8px;border-radius:2px}
.chip.plain{box-shadow:none;padding:0;height:20px}
.cchip{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-meta);color:var(--quiet);white-space:nowrap;flex:none}
.cchip .sw{width:8px;height:8px;border-radius:2px}
.filters{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.fchip{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 var(--sp-3);border-radius:var(--r-pill);font-size:var(--fs-body);color:var(--quiet);box-shadow:inset 0 0 0 1px var(--line2);cursor:pointer}
.fchip:hover{color:var(--text);background:var(--hover)}
.fchip.on{background:var(--text);color:var(--bg);box-shadow:none}
.fchip .n{font-size:var(--fs-meta);opacity:.75}
.fchip .ic{width:14px;height:14px}
.field{display:block;width:100%;min-height:40px;padding:9px var(--sp-3);border:0;border-radius:var(--r-md);background:transparent;box-shadow:inset 0 0 0 1px var(--line2);color:var(--text);font-size:var(--fs-body);line-height:var(--lh);resize:none}
.field::placeholder{color:var(--faint)}
.field:focus{box-shadow:inset 0 0 0 1.5px var(--text)}
.flabel{font-size:var(--fs-meta);font-weight:var(--fw-med);color:var(--quiet);margin-bottom:6px;display:flex;gap:var(--sp-2)}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:var(--r-md);box-shadow:inset 0 0 0 1px var(--line2);flex:none}
.seg button{all:unset;display:inline-flex;align-items:center;gap:6px;height:28px;line-height:28px;padding:0 var(--sp-3);border-radius:var(--r-sm);font-size:var(--fs-meta);color:var(--quiet);cursor:pointer}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--sel);color:var(--text)}
.tabs{display:flex;gap:var(--sp-6)}
.tabs a{display:inline-flex;align-items:center;gap:6px;height:40px;color:var(--quiet);cursor:pointer;box-shadow:inset 0 -2px 0 transparent}
.tabs a:hover{color:var(--text)}
.tabs a.on{color:var(--text);box-shadow:inset 0 -2px 0 var(--c,var(--text))}
.tabs a .n{font-size:var(--fs-meta);color:var(--faint)}
.meter{display:flex;gap:2px;height:4px;flex:none;width:100%}
.meter i{display:block;height:100%;border-radius:1px}
.m-ok{background:var(--ok)} .m-warn{background:var(--warn)} .m-bad{background:var(--bad)} .m-rest{background:var(--line2)}
.bar{height:4px;border-radius:2px;background:var(--line2);overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--quiet);border-radius:2px}
.legend{display:inline-flex;align-items:center;gap:var(--sp-3);font-size:var(--fs-meta);color:var(--faint)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:8px;height:4px;border-radius:1px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;flex:none}
.d-ok{background:var(--ok)} .d-warn{background:var(--warn)} .d-bad{background:var(--bad)} .d-info{background:var(--info)} .d-faint{background:var(--line2)}
.toast{position:fixed;left:50%;bottom:var(--sp-6);transform:translateX(-50%);display:flex;align-items:center;gap:var(--sp-3);height:40px;padding:0 var(--sp-2) 0 var(--sp-4);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-pop);z-index:30;animation:ev-rise var(--dur-2) var(--ease)}

/* ============ 4 · The object language ============ */
/* 4.0 Shared: the type glyph tile (shape = type; tint = course). */
.gt{width:28px;height:28px;border-radius:var(--r-md);display:inline-flex;align-items:center;justify-content:center;flex:none;background:color-mix(in srgb,var(--c,var(--faint)) var(--tint),transparent);color:var(--c,var(--quiet))}
.gt .ic{width:16px;height:16px}
.gt.sm{width:24px;height:24px;border-radius:var(--r-sm)} .gt.sm .ic{width:14px;height:14px}
.gt.lg{width:40px;height:40px;border-radius:var(--r-lg)} .gt.lg .ic{width:20px;height:20px}

/* 4.1 E.V.'s voice: her mark, one line, sources. */
.mark{width:16px;height:16px;border-radius:50%;border:2px dotted var(--her);flex:none;display:inline-block}
.mark.quiet{border-color:var(--faint)}
.evline{display:flex;align-items:flex-start;gap:var(--sp-3);color:var(--quiet)}
.evline > .mark{margin-top:3px}
.evline b{color:var(--text);font-weight:var(--fw-med)}
.unverified{font-size:var(--fs-meta);color:var(--faint);border-bottom:1px dashed var(--line2);white-space:nowrap}

/* 4.2 Link form: one inline chip for any object (also the source chip). Glyph says type, glyph colour says course. */
.olink{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 7px 0 6px;border-radius:var(--r-sm);background:var(--hover);color:var(--quiet);font-size:var(--fs-meta);white-space:nowrap;vertical-align:middle;cursor:pointer;max-width:100%}
.olink:hover{background:var(--sel);color:var(--text)}
.olink .ic{width:13px;height:13px;color:var(--c,var(--faint))}
.olink > span{overflow:hidden;text-overflow:ellipsis}
.olink .mark{width:12px;height:12px;border-width:1.5px}

/* 4.3 Plan item (Linear-like row): status circle · title · property chips. */
.pi{display:flex;align-items:center;gap:var(--sp-3);min-height:var(--row-plan);padding:0 var(--sp-2);margin:0 calc(-1 * var(--sp-2));border-radius:var(--r-md);cursor:pointer;transition:background-color var(--dur-1) var(--ease)}
.pi:hover{background:var(--hover)}
.pi .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi.done .ttl{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line2)}
.pi .props{display:flex;align-items:center;gap:var(--sp-2);flex:none}
.pi .est{width:32px;text-align:right;font-size:var(--fs-meta);color:var(--faint)}
.pi .cchip{width:60px}
.pi .when{width:56px;text-align:right;font-size:var(--fs-meta);color:var(--faint)}
.pi .sub-n{font-size:var(--fs-meta);color:var(--faint);display:inline-flex;gap:4px;align-items:center}
.status{width:16px;height:16px;flex:none}
.prio{display:inline-flex;align-items:flex-end;gap:2px;height:12px;width:14px;flex:none}
.prio i{display:block;width:3px;border-radius:1px;background:var(--line2)}
.prio i:nth-child(1){height:5px}.prio i:nth-child(2){height:8px}.prio i:nth-child(3){height:12px}
.prio.p1 i:nth-child(1),.prio.p2 i:nth-child(-n+2),.prio.p3 i{background:var(--quiet)}
.pi.proposed{border:1px dashed var(--line2);margin:var(--sp-1) calc(-1 * var(--sp-2)) 0;color:var(--quiet)}
.pi.proposed .status{opacity:.6}

/* 4.4 Set tiles (Quizlet-like). One tile family, four bodies. */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-4) var(--sp-4)}
.tiles.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tiles.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{position:relative;display:flex;flex-direction:column;gap:var(--sp-3);padding:var(--sp-4);border-radius:var(--r-xl);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line),var(--sh-tile);min-height:164px;cursor:pointer;transition:background-color var(--dur-1) var(--ease),box-shadow var(--dur-1) var(--ease)}
.tile:hover{background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2),var(--sh-tile)}
.tile .top{display:flex;align-items:center;gap:var(--sp-2)}
.tile .kind{font-size:var(--fs-meta);color:var(--faint)}
.tile .top .cchip{margin-left:auto}
.tile .name{font-weight:var(--fw-med);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .foot{margin-top:auto;display:flex;flex-direction:column;gap:var(--sp-2)}
.tile .facts{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-meta);color:var(--faint)}
.tile .facts b{font-weight:var(--fw-med);color:var(--quiet)}
/* Flashcard set: a stacked edge (two cards peeking below). */
.tile.cards{margin-bottom:10px;box-shadow:inset 0 0 0 1px var(--line),0 15px 0 -10px var(--surface),0 15px 0 -9px var(--line2),0 30px 0 -20px var(--surface),0 30px 0 -19px var(--line)}
.tile.cards:hover{box-shadow:inset 0 0 0 1px var(--line2),0 15px 0 -10px var(--raised),0 15px 0 -9px var(--line2),0 30px 0 -20px var(--raised),0 30px 0 -19px var(--line)}
/* Practice set: one pip per problem, last attempt (right / missed / not tried). */
.pips{display:flex;gap:3px;flex-wrap:wrap}
.pips i{display:block;width:10px;height:10px;border-radius:3px;background:var(--line2)}
.pips i.r{background:color-mix(in srgb,var(--ok) 75%,transparent)} .pips i.w{background:color-mix(in srgb,var(--bad) 80%,transparent)}
/* Mock exam: a clock and a perforated edge, like a paper you sit. */
.tile.mock .clock{display:flex;align-items:baseline;gap:var(--sp-2);font-size:var(--fs-meta);color:var(--faint)}
.tile.mock .clock b{font-size:var(--fs-read);font-weight:var(--fw-med);color:var(--text)}
.tile.mock .perf{border-top:1px dashed var(--line2);margin:0 calc(-1 * var(--sp-4));padding:var(--sp-3) var(--sp-4) 0}
/* Procedure set: numbered steps on a rail. */
.rail{display:flex;flex-direction:column;gap:6px;position:relative}
.rail::before{content:"";position:absolute;left:8px;top:10px;bottom:10px;width:1px;background:var(--line2)}
.rail .s{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-meta);color:var(--quiet);position:relative;min-width:0}
.rail .s span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{min-width:17px;height:17px;padding:0 3px;border-radius:9px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:11px;line-height:1;color:var(--quiet);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2)}
.tile:hover .num{background:var(--raised)}
.num.ok{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ok) 50%,transparent)}
.rail .s.more{color:var(--faint)}
/* Set row (list/search form) */
.srow{display:flex;align-items:center;gap:var(--sp-3);min-height:52px;padding:0 var(--sp-2);margin:0 calc(-1 * var(--sp-2));border-radius:var(--r-md);cursor:pointer}
.srow:hover{background:var(--hover)}
.srow .t{flex:1;min-width:0}
.srow .t > div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .t .meta{font-size:var(--fs-meta);color:var(--faint)}
/* Jump-back-in tile: horizontal */
.jtile{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-xl);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line),var(--sh-tile);cursor:pointer;min-width:0}
.jtile:hover{background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2),var(--sh-tile)}
.jtile .t{flex:1;min-width:0}
.jtile .t > div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 4.5 Note (Quip-like doc): a page with a folded corner, a title, two lines of preview. */
.doc-ic{position:relative;width:24px;height:30px;flex:none;border-radius:3px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2);margin-top:2px}
.doc-ic::before{content:"";position:absolute;top:0;right:0;width:8px;height:8px;background:var(--bg);border-bottom-left-radius:2px;box-shadow:inset 1px -1px 0 var(--line2)}
.doc-ic::after{content:"";position:absolute;left:5px;right:6px;top:12px;height:9px;border-top:1.5px solid var(--c,var(--line2));border-bottom:1.5px solid var(--line2);opacity:.9}
.nrow{display:flex;gap:var(--sp-3);padding:var(--sp-3) var(--sp-2);margin:0 calc(-1 * var(--sp-2));border-radius:var(--r-md);cursor:pointer}
.nrow:hover{background:var(--hover)}
.nrow:hover .doc-ic::before{background:var(--hover)}
.nrow.on{background:var(--sel)} .nrow.on .doc-ic::before{background:var(--sel)}
.nrow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nrow .h{display:flex;align-items:baseline;gap:var(--sp-3)}
.nrow .h > div{flex:1;min-width:0;font-weight:var(--fw-med);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow .pv{font-size:var(--fs-meta);color:var(--quiet);line-height:18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nrow .loc{font-size:var(--fs-meta);color:var(--faint);margin-top:2px;display:flex;gap:var(--sp-2);align-items:center}
.ntile{position:relative;display:flex;flex-direction:column;gap:var(--sp-2);padding:var(--sp-4) var(--sp-4) var(--sp-3);border-radius:var(--r-sm) var(--r-xl) var(--r-xl) var(--r-xl);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line),var(--sh-tile);min-height:164px;cursor:pointer}
.ntile::before{content:"";position:absolute;top:0;right:0;width:18px;height:18px;background:var(--bg);border-bottom-left-radius:4px;box-shadow:inset 1px -1px 0 var(--line2)}
.ntile .name{font-weight:var(--fw-med);padding-right:var(--sp-4)}
.ntile .pv{font-size:var(--fs-meta);color:var(--quiet);line-height:18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ntile .loc{margin-top:auto;font-size:var(--fs-meta);color:var(--faint);display:flex;gap:var(--sp-2);align-items:center}
.ntile:hover{box-shadow:inset 0 0 0 1px var(--line2),var(--sh-tile)}

/* 4.6 Job: E.V.'s ring, cut into its steps. */
.ring{flex:none;display:block}
.ring circle{fill:none;stroke-width:2.2}
.ring .rest{stroke:var(--line2)}
.ring.run .on{stroke:var(--info)} .ring.need .on{stroke:var(--warn)} .ring.done .on{stroke:var(--ok)} .ring.fail .on{stroke:var(--bad)}
.ring .fail-x{stroke:var(--bad)}
.job{display:grid;grid-template-columns:32px minmax(0,1fr) auto;column-gap:var(--sp-3);row-gap:6px;padding:var(--sp-4) 0;border-top:1px solid var(--line)}
.sec-head + .job{border-top:0;padding-top:var(--sp-2)}
.job .ring{grid-row:1 / span 3;margin-top:-2px}
.job > .ttl,.job > .state,.job > .steps,.job > .meta{grid-column:2}
.job .ttl{font-weight:var(--fw-med)}
.job .state{font-size:var(--fs-meta);color:var(--quiet);display:flex;align-items:center;gap:6px}
.job .steps{display:flex;gap:var(--sp-4);flex-wrap:wrap;font-size:var(--fs-meta);color:var(--faint)}
.job .steps span{display:inline-flex;align-items:center;gap:6px}
.job .steps span.done{color:var(--quiet)}
.job .steps span.cur{color:var(--text)}
.job .steps i{width:6px;height:6px;border-radius:50%;background:var(--line2);display:inline-block}
.job .steps span.done i{background:var(--quiet)}
.job .steps span.cur i{background:var(--info)}
.job.need .steps span.cur i{background:var(--warn)}
.job.fail .steps span.cur i{background:var(--bad)}
.job .meta{font-size:var(--fs-meta);color:var(--faint);display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap}
.job .act{grid-column:3;grid-row:1 / span 2;display:flex;gap:var(--sp-2);align-items:flex-start}
.job .why{grid-column:2;color:var(--text);font-size:var(--fs-body);max-width:560px}
.jcard{display:flex;gap:var(--sp-3);align-items:center;padding:var(--sp-3) var(--sp-4);border-radius:var(--r-xl);box-shadow:inset 0 0 0 1px var(--line);max-width:520px}

/* 4.7 Exam: a calendar date block + readiness. */
.dblock{width:44px;height:48px;border-radius:var(--r-md);flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c,var(--faint)) var(--tint),transparent);line-height:1.1}
.dblock .mo{font-size:11px;font-weight:var(--fw-med);color:var(--quiet);letter-spacing:.04em;text-transform:uppercase}
.dblock .dy{font-size:var(--fs-read);font-weight:var(--fw-title);color:var(--text)}
.erow{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-2);margin:0 calc(-1 * var(--sp-2));border-radius:var(--r-md);cursor:pointer}
.erow:hover{background:var(--hover)}
.erow .t{flex:1;min-width:0}
.erow .t > div:first-child{display:flex;gap:var(--sp-2);align-items:center}
.erow .t .meta{font-size:var(--fs-meta);color:var(--faint)}
.erow .ready{width:132px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;font-size:var(--fs-meta);color:var(--quiet)}

/* 4.8 Weak spot: a target and a right-of-tried fraction. */
.wrow{display:flex;align-items:center;gap:var(--sp-3);min-height:var(--row);padding:0 var(--sp-2);margin:0 calc(-1 * var(--sp-2));border-radius:var(--r-md);cursor:pointer}
.wrow:hover{background:var(--hover)}
.wrow .ic{color:var(--c,var(--faint))}
.wrow .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frac{display:flex;gap:2px}
.frac i{width:6px;height:12px;border-radius:2px;background:var(--line2)}
.frac i.r{background:var(--quiet)}
.wrow .of{font-size:var(--fs-meta);color:var(--faint);width:44px;text-align:right}

/* 4.9 Course: a tinted badge with its code; the swatch everywhere else. */
.cbadge{width:44px;height:44px;border-radius:var(--r-xl);flex:none;display:flex;align-items:center;justify-content:center;font-size:var(--fs-meta);font-weight:var(--fw-title);letter-spacing:.02em;color:var(--c);background:color-mix(in srgb,var(--c) var(--tint-2),transparent)}
.cbadge.sm{width:28px;height:28px;border-radius:var(--r-md);font-size:10px}

/* ============ 5 · Screens ============ */
/* Course space header */
.chead{max-width:calc(var(--col-wide) + 80px);margin:0 auto;padding:var(--sp-10) var(--sp-10) 0}
.chead .row1{display:flex;align-items:center;gap:var(--sp-4)}
.chead .tabs{margin-top:var(--sp-4)}
.chead-wrap{border-bottom:1px solid var(--line)}
.next-exam{display:flex;align-items:center;gap:var(--sp-3);padding:6px var(--sp-3) 6px 6px;border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.next-exam:hover{background:var(--hover)}
.next-exam .dblock{width:36px;height:38px}
.next-exam .dblock .dy{font-size:var(--fs-body)}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:var(--sp-12);align-items:start}
.rail-col{display:flex;flex-direction:column;gap:var(--sp-10)}
.kv{display:flex;justify-content:space-between;gap:var(--sp-3);min-height:32px;align-items:center;color:var(--quiet)}
.kv b{color:var(--text);font-weight:400;text-align:right}

/* Plan item detail: Linear issue */
.issue{display:flex;flex:1;min-width:0}
.issue .main{flex:1;min-width:0;overflow-y:auto}
.issue .main .inner{max-width:680px;margin:0 auto;padding:var(--sp-8) var(--sp-10) var(--sp-14);display:flex;flex-direction:column;gap:var(--sp-8)}
.props-pane{flex:0 0 312px;border-left:1px solid var(--line);padding:var(--sp-6) var(--sp-4);overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.prop{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;min-height:36px;gap:var(--sp-2)}
.prop > span:first-child{font-size:var(--fs-meta);color:var(--faint);padding-left:var(--sp-2)}
.pval{display:flex;align-items:center;gap:var(--sp-2);height:32px;padding:0 var(--sp-2);border-radius:var(--r-md);cursor:pointer;min-width:0;color:var(--text)}
.pval:hover{background:var(--hover)}
.pval > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pval .ic{color:var(--c,var(--quiet))}
.pval.faint{color:var(--faint)}
.subtasks .chk{display:flex;align-items:center;gap:var(--sp-3);min-height:36px}
.box{width:16px;height:16px;border-radius:var(--r-xs);box-shadow:inset 0 0 0 1.5px var(--line2);flex:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.box.on{background:var(--quiet);box-shadow:none}
.box.on::after{content:"";width:8px;height:4px;border-left:1.5px solid var(--bg);border-bottom:1.5px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}
.chk.done > span:last-child{color:var(--faint);text-decoration:line-through}
.log{display:flex;flex-direction:column;gap:var(--sp-2);font-size:var(--fs-meta);color:var(--faint)}
.log div{display:flex;gap:var(--sp-2);align-items:center}

/* Notes inside a course */
.notes-split{display:grid;grid-template-columns:200px minmax(0,1fr);gap:var(--sp-10);align-items:start}
.folders{display:flex;flex-direction:column;gap:2px;position:sticky;top:0}
.folder{display:flex;align-items:center;gap:var(--sp-2);height:32px;padding:0 var(--sp-2);border-radius:var(--r-md);color:var(--quiet);cursor:pointer}
.folder:hover{background:var(--hover);color:var(--text)}
.folder.on{background:var(--sel);color:var(--text)}
.folder .n{margin-left:auto;font-size:var(--fs-meta);color:var(--faint)}
.folder .ic{color:var(--faint)}
.folder.on .ic{color:var(--c)}
.doclist .grp{padding:var(--sp-4) 0 var(--sp-1);font-size:var(--fs-meta);font-weight:var(--fw-med);color:var(--faint);display:flex;align-items:center;gap:var(--sp-2)}
.doclist .grp:first-child{padding-top:0}
/* Open doc: list pane + editor */
.docview{display:flex;flex:1;min-height:0}
.docpane{flex:0 0 272px;border-right:1px solid var(--line);padding:var(--sp-4) var(--sp-3);overflow-y:auto}
.docpane .nrow{padding:var(--sp-2);margin:0}
.editor{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.sessionbar{flex:none;display:flex;align-items:center;gap:var(--sp-3);height:48px;padding:0 var(--sp-6);border-bottom:1px solid var(--line);color:var(--quiet);font-size:var(--fs-body)}
.editor .scroll{flex:1;overflow-y:auto}
.paper{max-width:680px;margin:0 auto;padding:var(--sp-8) var(--sp-10) var(--sp-14);display:flex;flex-direction:column;gap:var(--sp-4);font-size:var(--fs-read);line-height:1.65}
.paper h1{font-size:var(--fs-display);font-weight:var(--fw-title);letter-spacing:-.015em;line-height:1.25}
.paper h2{font-size:var(--fs-read);font-weight:var(--fw-title);margin-top:var(--sp-4)}
.paper ul{margin:0;padding-left:var(--sp-6);display:flex;flex-direction:column;gap:2px}
.paper .reading{background:color-mix(in srgb,var(--info) 12%,transparent);box-shadow:-12px 0 0 color-mix(in srgb,var(--info) 12%,transparent),12px 0 0 color-mix(in srgb,var(--info) 12%,transparent);border-radius:2px}
.cols2{display:grid;grid-template-columns:220px minmax(0,1fr);gap:var(--sp-6);align-items:start}
.figure{display:flex;flex-direction:column;gap:var(--sp-2);padding:var(--sp-3);border-radius:var(--r-lg);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:var(--fs-meta);color:var(--faint);line-height:1.4}
.figure svg{width:100%;height:auto}
.checks{display:flex;flex-direction:column}
.checks .chk{display:flex;gap:var(--sp-3);align-items:center;min-height:32px;font-size:var(--fs-body)}
.ev-check{display:flex;gap:var(--sp-3);padding:var(--sp-4);border-radius:var(--r-xl);box-shadow:inset 0 0 0 1px var(--line2);font-size:var(--fs-body);line-height:var(--lh)}
.ev-check .say{flex:1;display:flex;flex-direction:column;gap:var(--sp-3)}
.saved{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-meta);color:var(--faint)}

/* Study modes */
.study{display:flex;flex-direction:column;flex:1;min-width:0}
.studybar{flex:none;display:flex;align-items:center;gap:var(--sp-4);height:56px;padding:0 var(--sp-6);border-bottom:1px solid var(--line)}
.studybar .bar{width:160px}
.study .stage{flex:1;overflow-y:auto}
.study .stage .inner{max-width:680px;margin:0 auto;padding:var(--sp-10) var(--sp-10) var(--sp-12);display:flex;flex-direction:column;gap:var(--sp-6)}
.fcard{position:relative;min-height:280px;border-radius:var(--r-xl);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2),var(--sh-tile);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-3);padding:var(--sp-10) var(--sp-12);text-align:center;cursor:pointer}
.fcard .side{position:absolute;top:var(--sp-4);left:var(--sp-4);font-size:var(--fs-meta);color:var(--faint)}
.fcard .corner{position:absolute;top:var(--sp-4);right:var(--sp-4)}
.fcard .face{font-size:var(--fs-display);font-weight:var(--fw-med);letter-spacing:-.01em;line-height:1.3}
.fcard .back{font-size:var(--fs-read);line-height:1.6;max-width:480px}
.fcard.stacked{margin-bottom:12px;box-shadow:inset 0 0 0 1px var(--line2),0 18px 0 -12px var(--surface),0 18px 0 -11px var(--line2),0 36px 0 -24px var(--surface),0 36px 0 -23px var(--line)}
.cardnav{display:flex;align-items:center;justify-content:center;gap:var(--sp-4);font-size:var(--fs-meta);color:var(--faint)}
.attempt{display:flex;flex-direction:column;gap:var(--sp-2)}
.yours{padding-left:var(--sp-3);border-left:2px solid var(--line2);color:var(--quiet);text-align:left}
.rate{display:flex;gap:var(--sp-3);justify-content:center}
.rate .btn{min-width:140px;height:40px}
.qcard{border-radius:var(--r-xl);box-shadow:inset 0 0 0 1px var(--line2);padding:var(--sp-6);display:flex;flex-direction:column;gap:var(--sp-4);background:var(--surface)}
.navigator{display:flex;gap:6px}
.navigator a{width:28px;height:28px;border-radius:var(--r-sm);display:inline-flex;align-items:center;justify-content:center;font-size:var(--fs-meta);color:var(--faint);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.navigator a.r{color:var(--ok);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ok) 45%,transparent)}
.navigator a.w{color:var(--bad);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad) 45%,transparent)}
.navigator a.cur{color:var(--text);box-shadow:inset 0 0 0 1.5px var(--text)}
.answer-in{display:flex;align-items:center;gap:var(--sp-3)}
.answer-in .field{width:140px;font-size:var(--fs-read)}
.reveal{display:flex;flex-direction:column;gap:var(--sp-3);padding-top:var(--sp-4);border-top:1px solid var(--line);animation:ev-rise var(--dur-3) var(--ease)}
.work{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--sp-1) var(--sp-3);font-size:var(--fs-body);color:var(--quiet)}
.work b{color:var(--text);font-weight:var(--fw-med)}
/* Procedure recall */
.ptrack{display:flex;flex-direction:column;position:relative}
.ptrack::before{content:"";position:absolute;left:13px;top:16px;bottom:16px;width:1px;background:var(--line2)}
.pstep{display:flex;align-items:center;gap:var(--sp-3);min-height:40px;position:relative}
.pstep .num{width:27px;height:27px;font-size:var(--fs-meta);background:var(--bg)}
.pstep.slot .num{box-shadow:inset 0 0 0 1.5px var(--text);color:var(--text)}
.pstep.slot .ph{flex:1;height:36px;border-radius:var(--r-md);border:1px dashed var(--line2);display:flex;align-items:center;padding:0 var(--sp-3);color:var(--faint)}
.pstep.todo{color:var(--faint)}
.opts{display:flex;flex-direction:column;gap:var(--sp-2)}
.optc{display:flex;align-items:center;gap:var(--sp-3);min-height:44px;padding:var(--sp-2) var(--sp-3);border-radius:var(--r-md);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.optc:hover{background:var(--hover)}
.optc.on{box-shadow:inset 0 0 0 1.5px var(--text);background:var(--hover)}
.optc .kbd{margin-left:auto}

/* Ask E.V. */
.chat{display:flex;flex-direction:column;gap:var(--sp-6)}
.msg{display:grid;grid-template-columns:24px minmax(0,1fr);column-gap:var(--sp-3);align-items:start}
.msg > .mark{margin:3px 0 0 4px}
.msg .me-av{width:24px;height:24px;border-radius:50%;background:var(--sel);color:var(--quiet);font-size:11px;font-weight:var(--fw-title);display:inline-flex;align-items:center;justify-content:center}
.msg .say{display:flex;flex-direction:column;gap:var(--sp-2);max-width:600px}
.msg .who{display:flex;align-items:baseline;gap:var(--sp-2);font-size:var(--fs-meta);font-weight:var(--fw-med);color:var(--quiet)}
.msg .who time{font-weight:400;color:var(--faint)}
.chat-break{display:flex;align-items:center;gap:var(--sp-3);font-size:var(--fs-meta);color:var(--faint)}
.chat-break::before,.chat-break::after{content:"";flex:1;height:1px;background:var(--line)}
.composer{display:flex;flex-direction:column;gap:var(--sp-2);border-radius:var(--r-xl);box-shadow:inset 0 0 0 1px var(--line2);padding:var(--sp-3);background:var(--surface)}
.composer textarea{border:0;background:transparent;resize:none;outline:none;min-height:24px;color:var(--text)}
.composer textarea::placeholder{color:var(--faint)}

/* Sheet (add course) and palette */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding-top:72px;animation:ev-fade var(--dur-1) var(--ease)}
.sheet{width:480px;border-radius:var(--r-xl);background:var(--surface);box-shadow:var(--sh-pop);display:flex;flex-direction:column;animation:ev-rise var(--dur-2) var(--ease)}
.sheet .hd{display:flex;align-items:flex-start;gap:var(--sp-3);padding:var(--sp-6) var(--sp-6) var(--sp-2)}
.sheet .bd{padding:var(--sp-4) var(--sp-6) var(--sp-6);display:flex;flex-direction:column;gap:var(--sp-5)}
.sheet .ft{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-4) var(--sp-6);border-top:1px solid var(--line)}
.sheet .two{display:grid;grid-template-columns:120px minmax(0,1fr);gap:var(--sp-3)}
.swatches{display:flex;gap:var(--sp-2)}
.swatches button{all:unset;width:28px;height:28px;border-radius:var(--r-md);background:var(--c);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.swatches button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.preview-strip{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);border-radius:var(--r-lg);background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.palette{width:600px;border-radius:var(--r-xl);background:var(--surface);box-shadow:var(--sh-pop);overflow:hidden;animation:ev-rise var(--dur-2) var(--ease)}
.palette .in{display:flex;align-items:center;gap:var(--sp-3);height:52px;padding:0 var(--sp-5);border-bottom:1px solid var(--line);color:var(--faint)}
.palette .in input{flex:1;border:0;background:transparent;outline:none;font-size:var(--fs-read);color:var(--text)}
.palette .list{padding:var(--sp-2);max-height:520px;overflow-y:auto}
.palette .grp{padding:var(--sp-3) var(--sp-3) var(--sp-1);font-size:var(--fs-meta);font-weight:var(--fw-med);color:var(--faint)}

const meter = (m, w) => `<div class="meter" ${w?`style="width:${w}px"`:''}>${m.map((x,i)=>`<i class="${['m-ok','m-warn','m-bad'][i]}" style="width:${x}%"></i>`).join('')}</div>`;
const legend = () => `<span class="legend"><span><i class="m-ok"></i>learned</span><span><i class="m-warn"></i>familiar</span><span><i class="m-bad"></i>weak</span></span>`;
const setGo = s => s.k==='cards' ? 'set' : s.k==='practice' ? 'practice' : s.k==='mock' ? (s.writing?'activity':'practice') : 'procedure';

/* ================= Object renderers: one per type, in list / tile / link forms ================= */
/* Job: E.V.'s ring, cut into one arc per step. Done arcs take the state colour. */
function ring(n, done, state, size=28){
  const r = size/2 - 2, C = 2*Math.PI*r, per = C/n, gap = n>1 ? Math.min(3, per*.28) : 0, seg = per - gap;
  let arcs = '';
  for (let i=0;i<n;i++){
    const on = i < done || state==='done';
    const cur = i === done && state!=='done';
    arcs += `<circle cx="${size/2}" cy="${size/2}" r="${r}" class="${on||cur?'on':'rest'}" style="${cur?'opacity:.45;':''}stroke-width:${size<20?2:2.2}" stroke-dasharray="${seg} ${C}" stroke-dashoffset="${-(i*per)}"/>`;
  }
  return `<svg class="ring ${state}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><g transform="rotate(-90 ${size/2} ${size/2})">${arcs}</g></svg>`;
}
function status(s){
  if (s==='done') return `<svg class="status" viewBox="0 0 16 16" aria-label="Done"><circle cx="8" cy="8" r="6.5" fill="var(--ok)"/><path d="m5.2 8.2 1.9 1.9 3.7-4" fill="none" stroke="var(--bg)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  if (s==='prog') return `<svg class="status" viewBox="0 0 16 16" aria-label="In progress"><circle cx="8" cy="8" r="6" fill="none" stroke="var(--warn)" stroke-width="1.5"/><path d="M8 4.5a3.5 3.5 0 0 1 0 7z" fill="var(--warn)"/></svg>`;
  if (s==='proposed') return `<svg class="status" viewBox="0 0 16 16" aria-label="Proposed"><circle cx="8" cy="8" r="6" fill="none" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="2 2.2"/></svg>`;
  if (s==='cancel') return `<svg class="status" viewBox="0 0 16 16" aria-label="Put away"><circle cx="8" cy="8" r="6.5" fill="var(--line2)"/><path d="m6 6 4 4M10 6l-4 4" stroke="var(--bg)" stroke-width="1.5" stroke-linecap="round"/></svg>`;
  return `<svg class="status" viewBox="0 0 16 16" aria-label="To do"><circle cx="8" cy="8" r="6" fill="none" stroke="var(--faint)" stroke-width="1.5"/></svg>`;
}
const prio = p => `<span class="prio p${p}" title="${['','Low','Medium','High'][p]} priority"><i></i><i></i><i></i></span>`;
const gt = (kind, ck, cls='') => `<span class="gt ${cls}" ${cs(ck)}>${ic(K[kind]?K[kind].g:kind)}</span>`;
const cchip = ck => `<span class="cchip" ${cs(ck)}><i class="sw"></i>${COURSES[ck].code}</span>`;
const courseChip = ck => `<span class="cchip" ${cs(ck)}><i class="sw"></i>${COURSES[ck].code}</span>`;

/* Link form: any object as one inline chip. */
function olink(type, id, label){
  if (type==='set'){ const s=S(id); return `<a class="olink" ${cs(s.course)} data-go="${setGo(s)}">${ic(K[s.k].g)}<span>${label||s.title}</span></a>`; }
  if (type==='note'){ const n=N(id); return `<a class="olink" ${cs(n.course)} data-go="course/nur112/notes/wk9">${ic('note')}<span>${label||n.title}</span></a>`; }
  if (type==='weak'){ const w=WEAK.find(x=>x.id===id); return `<a class="olink" ${cs(w.course)} data-go="course/${COURSES[w.course].id}">${ic('weak')}<span>${label||`${w.title} · ${w.r} of ${w.n}`}</span></a>`; }
  if (type==='exam'){ const e=EXAMS.find(x=>x.id===id); return `<a class="olink" ${cs(e.course)} data-go="course/${COURSES[e.course].id}/exams">${ic('exam')}<span>${label||`${COURSES[e.course].code} · ${e.title}`}</span></a>`; }
  if (type==='job'){ const j=JOBS.find(x=>x.id===id); return `<a class="olink" data-go="activity">${ring(j.steps.length,j.cur,j.state,13)}<span>${label||j.title}</span></a>`; }
  if (type==='course'){ const c=COURSES[id]; return `<a class="olink" ${cs(id)} data-go="course/${c.id}"><i class="sw" style="width:8px;height:8px;border-radius:2px"></i><span>${c.code}</span></a>`; }
  if (type==='plan'){ const p=PLAN.find(x=>x.id===id); return `<a class="olink" ${cs(p.course)} data-go="item">${status(p.status).replace('class="status"','class="status" style="width:13px;height:13px"')}<span>${label||p.title}</span></a>`; }
  if (type==='job-status') return `<a class="olink" data-go="activity"><span class="mark quiet"></span><span>${label}</span></a>`;
}
function linkChip(link, ck){
  const [type,id,extra] = link;
  if (type==='set'){ const s=S(id); return `<span class="chip" ${cs(ck)} title="${K[s.k].label}">${ic(K[s.k].g)}<span>${s.title}${extra?` · ${extra}`:''}</span></span>`; }
  const n=N(id); return `<span class="chip" ${cs(ck)} title="Note">${ic('note')}<span>${n.title}</span></span>`;
}

/* Plan item: Linear-like row, status circle first, properties as chips on the right. */
function planRow(p, o={}){
  const course = o.course !== false;
  const cls = [p.status==='done'?'done':'', o.proposed?'proposed':''].join(' ');
  return `<div class="pi ${cls}" data-go="item" tabindex="0">${status(o.proposed?'proposed':p.status)}${o.noprio?'':prio(p.prio)}<span class="ttl">${p.title}</span><span class="props">`+
    (p.subs?`<span class="sub-n" title="Subtasks">${ic('check')}${p.subs}</span>`:'')+
    (p.repeat?`<span class="sub-n" title="Repeats">${ic('repeat')}</span>`:'')+
    linkChip(p.link, p.course)+(course?courseChip(p.course):'')+
    `<span class="est">${p.est}</span>${o.nowhen?'':`<span class="when">${p.when}</span>`}</span>${o.after||''}</div>`;
}
/* A plan item as a board card (tile form, used where items are laid out on a board). */
function planCard(p){
  return `<div class="tile" style="min-height:0;gap:10px" data-go="item"><div class="line g2">${status(p.status)}${prio(p.prio)}<span class="t-meta" style="margin-left:auto">${p.when}</span></div><div class="t-med">${p.title}</div><div class="line g2" style="flex-wrap:wrap">${linkChip(p.link,p.course)}<span class="t-meta">${p.est}</span></div></div>`;
}

/* Sets: one tile family with four bodies. */
function tile(s, o={}){
  const top = `<div class="top">${gt(s.k,s.course)}<span class="kind">${K[s.k].label}</span>${o.nocourse?'':cchip(s.course)}</div><div class="name">${s.title}</div>`;
  let body = '';
  if (s.k==='cards'){
    body = `<div class="foot"><div class="facts"><b>${s.n} cards</b><span>·</span><span>${s.m[0]} learned</span></div>${meter(pct(s.m))}</div>`;
  } else if (s.k==='practice'){
    const tried = [...s.res].filter(c=>c!=='-').length, right=[...s.res].filter(c=>c==='r').length;
    body = `<div class="foot"><div class="pips" title="Last try: ${right} of ${tried} right">${[...s.res].map(c=>`<i class="${c==='r'?'r':c==='w'?'w':''}"></i>`).join('')}</div><div class="facts"><b>${s.n} problems</b><span>·</span><span>${s.acc}% last try</span></div></div>`;
  } else if (s.k==='mock'){
    body = `<div class="clock">${ic('mock')}<b>${s.min} min</b><span>${s.q} questions</span></div><div class="foot perf">`+
      (s.writing?`<div class="facts">${ring(5,2,'run',14)}<span>E.V. is writing it · 3 of 5</span></div>`:
       s.best?`<div class="facts"><b>Best ${s.best}%</b><span>·</span><span>${s.last}</span></div>`:`<div class="facts"><span>Ready · not sat yet</span></div>`)+`</div>`;
  } else {
    body = `<div class="foot"><div class="rail">${s.steps.map((t,i)=>`<div class="s"><span class="num">${i+1}</span><span>${t}</span></div>`).join('')}<div class="s more"><span class="num">+${s.n-2}</span><span>${s.last}</span></div></div></div>`;
  }
  return `<a class="tile ${s.k}" data-go="${setGo(s)}" tabindex="0">${top}${body}</a>`;
}
function setRow(s, o={}){
  const facts = s.k==='cards'?`${s.n} cards · ${s.m[0]} learned`:s.k==='practice'?`${s.n} problems · ${s.acc}% last try`:s.k==='mock'?`${s.q} questions · ${s.min} min`:`${s.n} steps · ${s.last}`;
  const right = s.k==='cards'?meter(pct(s.m),72):s.k==='practice'?`<div class="pips" style="width:${s.n*13}px">${[...s.res].map(c=>`<i class="${c==='r'?'r':c==='w'?'w':''}"></i>`).join('')}</div>`:s.k==='mock'?`<span class="t-meta">${s.writing?'being written':s.best?'best '+s.best+'%':'not sat'}</span>`:`<span class="t-meta nowrap">1 → ${s.n}</span>`;
  return `<a class="srow" data-go="${setGo(s)}">${gt(s.k,s.course,'sm')}<div class="t"><div>${s.title}</div><div class="meta">${K[s.k].label} · ${facts}${o.course===false?'':' · '+COURSES[s.course].code}</div></div>${right}</a>`;
}
function jtile(s, line, prog){
  return `<a class="jtile" data-go="${setGo(s)}">${gt(s.k,s.course,'lg')}<div class="t"><div class="t-med">${s.title}</div><div class="t-meta">${K[s.k].label} · ${line}</div><div class="bar" style="width:100%;margin-top:8px"><i style="width:${prog}%"></i></div></div></a>`;
}

/* Note: a doc with a folded corner and two lines of preview. */
function noteRow(n, o={}){
  return `<a class="nrow ${o.on?'on':''}" ${cs(n.course)} data-go="course/nur112/notes/wk9"><span class="doc-ic"></span><div class="t"><div class="h"><div>${n.title}</div><span class="t-meta">${n.when}</span></div>${o.nopv?'':`<div class="pv">${n.pv}</div>`}${o.loc===false?'':`<div class="loc">${o.course===false?'':cchip(n.course)+'<span>·</span>'}<span>${n.folder}</span></div>`}</div></a>`;
}
function noteTile(n){
  return `<a class="ntile" ${cs(n.course)} data-go="course/nur112/notes/wk9"><div class="name">${n.title}</div><div class="pv">${n.pv}</div><div class="loc">${cchip(n.course)}<span>·</span><span>${n.folder}</span></div></a>`;
}

/* Exam: date block + readiness. */
const dblock = e => `<span class="dblock" ${cs(e.course)}><span class="mo">${e.mo}</span><span class="dy">${e.dy}</span></span>`;
function examRow(e, o={}){
  if (o.compact) return `<a class="erow" data-go="course/${COURSES[e.course].id}/exams">${dblock(e)}<div class="t"><div><span class="t-med">${e.title}</span></div><div class="meta">${e.dow.slice(0,3)} · ${e.ready}% ready</div>${meter(e.m)}</div></a>`;
  return `<a class="erow" data-go="course/${COURSES[e.course].id}/exams">${dblock(e)}<div class="t"><div><span class="t-med">${o.course===false?'':COURSES[e.course].code+' · '}${e.title}</span></div><div class="meta">${e.dow} · ${e.note}</div></div><div class="ready"><span>${e.ready}% ready</span>${meter(e.m)}</div></a>`;
}
function examTile(e){
  return `<div class="tile" style="min-height:0"><div class="top">${dblock(e)}<div><div class="t-med">${e.title}</div><div class="t-meta">${COURSES[e.course].code} · ${e.dow.slice(0,3)}</div></div></div><div class="facts" style="font-size:12px;color:var(--quiet)">${e.ready}% ready</div>${meter(e.m)}</div>`;
}
/* Weak spot: a target and how many of the recent tries were right. */
const frac = w => `<span class="frac" title="${w.r} of ${w.n} right lately">${Array.from({length:w.n},(_,i)=>`<i class="${i<w.r?'r':''}"></i>`).join('')}</span>`;
function weakRow(w, o={}){
  return `<div class="wrow" ${cs(w.course)}>${ic('weak')}<span class="t">${w.title}</span>${o.course?cchip(w.course):''}${o.nofrac?'':frac(w)}<span class="of">${w.r} of ${w.n}</span></div>`;
}
function weakTile(w){
  return `<div class="tile" style="min-height:0" ${cs(w.course)}><div class="top"><span class="gt sm" ${cs(w.course)}>${ic('weak')}</span><span class="kind">Weak spot</span></div><div class="t-med">${w.title}</div><div class="line g3">${frac(w)}<span class="t-meta">${w.r} of ${w.n} right</span></div></div>`;
}
/* Job: ring + state + its steps + where it lands. */
function jobBlock(j, o={}){
  const steps = j.steps.map((t,i)=>`<span class="${i<j.cur||j.state==='done'?'done':i===j.cur?'cur':''}"><i></i>${t}</span>`).join('');
  const act = j.act ? `<div class="act"><button class="btn ${o.primary?'primary':'secondary'}" ${j.go?`data-go="${j.go}"`:'data-act="toast" data-msg="'+(j.act==='Retry'?'Retrying Canvas sync':'Opened for review')+'"'}>${j.act}</button></div>` : '';
  return `<div class="job ${j.state}">${ring(j.steps.length,j.cur,j.state,32)}<div class="ttl">${j.title}</div>${act}<div class="state">${j.label}${j.course?` · ${cchip(j.course)}`:''}</div>${j.why?`<div class="why">${j.why}</div>`:''}<div class="steps">${steps}</div><div class="meta"><span class="line g2">lands in <a class="olink" data-go="${j.lands[1]}">${ic('folder')}<span>${j.lands[0]}</span></a></span><span>${j.cost}</span><span>${j.time}</span></div></div>`;
}
function jobCard(j){
  return `<a class="jcard" data-go="activity">${ring(j.steps.length,j.cur,j.state,32)}<div class="grow"><div class="t-med">${j.title}</div><div class="t-meta">${j.short||j.label}</div></div><span class="t-meta">${j.cost.split(' ')[0]}</span></a>`;
}
/* E.V.'s voice */
const evline = (html, orange=false) => `<div class="evline"><span class="mark ${orange?'':'quiet'}"></span><span>${html}</span></div>`;

    return `<a class="nav ${nav===c.id?'on':''}" ${cs(k)} data-go="course/${c.id}"><i class="sw"></i>${c.code}<span class="n">${e.dow.slice(0,3)==='Thu'?'Exam Thu':e.mo+' '+e.dy}</span></a>`; };
  return `<div class="ws"><span class="mark quiet"></span>E.V.</div>
    <div class="search" data-act="palette" role="button" tabindex="0">${ic('search')}<span class="grow">Search or ask</span>${kbd('⌘K')}</div>
    ${n('today','home','Today','4','today')}${n('ask','ask','Ask E.V.','','ask')}${n('activity','activity','Activity','2','activity')}

      <div class="jobline" data-go="activity" title="Open in Activity">${ring(5,2,'run',14)}<span class="ell">Writing Exam 3 mock · 3 of 5</span></div>
      <a class="nav ${nav==='system'?'on':''}" data-go="system" style="font-size:12px">${ic('sort')}Design system</a>
      <a class="nav ${nav==='phone'?'on':''}" data-go="phone" style="font-size:12px">${ic('cards')}Phone</a>

/* Course space header: badge, name, code, next exam, one action; then tabs. */
function chead(k, tab, primary=''){
  const c = COURSES[k], e = EXAMS.find(x=>x.id===c.exam);
  const count = {
    plan: PLAN.filter(p=>p.course===k).length, library: SETS.filter(s=>s.course===k).length,
    notes: NOTES.filter(n=>n.course===k).length, exams: EXAMS.filter(x=>x.course===k).length };
  const t = (key,label,go) => `<a class="${tab===key?'on':''}" data-go="${go}">${label}${count[key]?`<span class="n">${count[key]}</span>`:''}</a>`;
  return `<div class="chead-wrap" ${cs(k)}><div class="chead">
    <div class="row1"><span class="cbadge">${c.abbr}</span>
      <div class="grow"><h1 class="t-title">${c.name}</h1><div class="t-meta line g2">${c.code}<span>·</span>${c.meets}<span>·</span><a class="olink" data-act="toast" data-msg="Opens the course in Canvas">${ic('out')}<span>Canvas</span></a></div></div>
      <a class="next-exam" data-go="course/${c.id}/exams" title="Next exam">${dblock(e)}<div><div class="t-med nowrap">${e.title} · ${e.dow.slice(0,3)}</div><div class="t-meta nowrap">${e.ready}% ready</div></div>${meter(e.m,64)}</a>
      ${primary}</div>
    <nav class="tabs">${t('overview','Overview',`course/${c.id}`)}${t('plan','Plan',`course/${c.id}/plan`)}${t('library','Library',`course/${c.id}/library`)}${t('notes','Notes',`course/${c.id}/notes`)}${t('exams','Exams',`course/${c.id}/exams`)}</nav>
  </div></div>`;
}

/* 3 · Course space · Overview */
function courseOverview(k){
  const c = COURSES[k];
  const plan = PLAN.filter(p=>p.course===k && p.status!=='done').slice(0,3);
  const mats = k==='nur' ? ['fluid-terms','oral-liquid','exam3-mock','gloving'] : ['co-terms','co-calc','lab2-mock','blood-flow'];
  const notes = NOTES.filter(n=>n.course===k).slice(0,3);
  const line = k==='nur'
    ? `<b>Exam 3 is in 3 days.</b> Oral liquid doses pulls readiness down most; it’s on your plan at 10:00. ${olink('weak','w1')}`
    : `<b>Lab practical 2 is a week out.</b> Frank–Starling is the weak spot here; 10 minutes tonight. ${olink('weak','w4')}`;
  return `<div class="page">${chead(k,'overview',`<button class="btn primary" data-go="practice">Study next ${kbd('S')}</button>`)}
  <div class="col wide" style="padding-top:var(--sp-10)"><div class="cgrid">
    <div class="stack g12">
      ${evline(line)}
      <section class="sec"><div class="sec-head"><h2 class="t-label">Up next</h2><span class="more" data-go="course/${c.id}/plan">Plan</span></div>
        ${plan.map(p=>planRow(p,{course:false})).join('')}</section>
      <section class="sec"><div class="sec-head"><h2 class="t-label">Study materials</h2><span class="more" data-go="course/${c.id}/library">All ${SETS.filter(s=>s.course===k).length} in Library</span></div>
        <div class="tiles c2">${mats.map(id=>tile(S(id),{nocourse:true})).join('')}</div></section>
      <section class="sec"><div class="sec-head"><h2 class="t-label">Recent notes</h2><span class="more" data-go="course/${c.id}/notes">All ${NOTES.filter(n=>n.course===k).length} notes</span></div>
        ${notes.map(n=>noteRow(n,{course:false})).join('')}</section>
    </div>
    <aside class="rail-col">
      <section class="sec"><div class="sec-head"><h2 class="t-label">Exams</h2></div>${EXAMS.filter(e=>e.course===k).map(e=>examRow(e,{compact:true})).join('')}</section>
      <section class="sec"><div class="sec-head"><h2 class="t-label">Weak spots</h2></div>${WEAK.filter(w=>w.course===k).map(w=>weakRow(w,{nofrac:true})).join('')}</section>
      <section class="sec"><div class="sec-head"><h2 class="t-label">About</h2></div>
        <div class="kv"><span>Meets</span><b>${c.meets}</b></div>
        <div class="kv"><span>Canvas</span><b class="line g2" style="justify-content:flex-end"><i class="dot d-bad"></i>sync failed Sun</b></div>
        <div class="kv"><span>Studied this week</span><b>${k==='nur'?'3 h 20 m':'1 h 50 m'}</b></div></section>
    </aside>
  </div></div></div>`;
}

/* 3b · Course space · Plan (Linear list, grouped by day) */
function coursePlan(k){
  const c = COURSES[k], items = PLAN.filter(p=>p.course===k);
  const groups = [...new Set(items.map(p=>p.day))];
  return `<div class="page">${chead(k,'plan',`<button class="btn primary" data-act="toast" data-msg="New plan item">New item ${kbd('C')}</button>`)}
  <div class="col wide" style="padding-top:var(--sp-8);gap:var(--sp-8)">
    <div class="line g2"><button class="fchip on">All</button><button class="fchip">Mine</button><button class="fchip">From E.V.</button><span class="grow"></span><button class="btn text">${ic('sort')}Group: day</button><button class="btn text">${ic('tag')}Properties</button></div>
    ${groups.map(g=>`<section class="sec"><div class="sec-head"><h2 class="t-label">${g}</h2><span class="t-meta">${items.filter(p=>p.day===g).length}</span></div>${items.filter(p=>p.day===g).map(p=>planRow(p,{course:false})).join('')}</section>`).join('')}
  </div></div>`;
}

/* 3c · Course space · Library (sets by type, Quizlet-like tiles) */
function typeFilters(sets){
  const n = k => sets.filter(s=>k==='all'||s.k===k).length;
  return `<div class="filters">${['all','cards','practice','mock','proc'].map(k=>`<button class="fchip ${st.libType===k?'on':''}" data-act="libtype" data-k="${k}">${k==='all'?'':ic(K[k].g)}${k==='all'?'All':K[k].plural}<span class="n">${n(k)}</span></button>`).join('')}</div>`;
}
function setSections(sets, o={}){
  const kinds = st.libType==='all' ? ['cards','practice','mock','proc'] : [st.libType];
  return kinds.map(k=>{ const list = sets.filter(s=>s.k===k); if(!list.length) return '';
    return `<section class="sec"><div class="sec-head"><span class="gt sm">${ic(K[k].g)}</span><h2 class="t-label">${K[k].plural}</h2><span class="t-meta">${list.length}</span></div><div class="tiles">${list.map(s=>tile(s,o)).join('')}</div></section>`; }).join('');
}
function courseLibrary(k){
  const sets = SETS.filter(s=>s.course===k);
  return `<div class="page">${chead(k,'library',`<button class="btn primary" data-act="toast" data-msg="New set: pick a type">Create set ${kbd('C')}</button>`)}
  <div class="col wide" style="padding-top:var(--sp-8);gap:var(--sp-10)">
    <div class="line g3">${typeFilters(sets)}<span class="grow"></span><span class="t-meta">Sorted by last studied</span></div>
    ${st.libType==='all' ? `<div class="tiles">${sets.map(s=>tile(s,{nocourse:true})).join('')}</div>` : setSections(sets,{nocourse:true})}
  </div></div>`;
}

/* 3d · Course space · Notes (Quip-like: minimal folders, a doc list with previews) */
function folderList(k){
  const f = FOLDERS[k], count = name => NOTES.filter(n=>n.course===k && (name==='all'||n.folder===name)).length;
  return `<nav class="folders" ${cs(k)}>
    <a class="folder ${st.folder==='all'?'on':''}" data-act="folder" data-f="all">${ic('notes')}All notes<span class="n">${count('all')}</span></a>
    ${f.map(name=>`<a class="folder ${st.folder===name?'on':''}" data-act="folder" data-f="${name}">${ic('folder')}${name}<span class="n">${count(name)}</span></a>`).join('')}
    <a class="folder" style="color:var(--faint)" data-act="toast" data-msg="New folder">${ic('plus')}New folder</a></nav>`;
}
function courseNotes(k){
  const shown = st.folder==='all' ? FOLDERS[k] : [st.folder];
  return `<div class="page">${chead(k,'notes',`<button class="btn primary" data-act="toast" data-msg="New note in ${st.folder==='all'?'Lecture notes':st.folder}">New note ${kbd('N')}</button>`)}
  <div class="col wide" style="padding-top:var(--sp-8)"><div class="notes-split">${folderList(k)}
    <div class="doclist">${shown.map(f=>`<div class="grp">${ic('folder')}${f}</div>${NOTES.filter(n=>n.course===k&&n.folder===f).map(n=>noteRow(n,{loc:false})).join('')}`).join('')}</div>
  </div></div></div>`;
}

  <div class="docview">
    <nav class="docpane" ${cs(k)}>
      <a class="folder" data-go="course/nur112/notes" style="margin-bottom:8px">${ic('left')}<span>Lecture notes</span><span class="n">${list.length}</span></a>
      ${list.map((n,i)=>noteRow(n,{loc:false,on:i===0})).join('')}
    </nav>
    <div class="editor">
      <div class="sessionbar"><i class="dot d-info"></i><span class="nowrap">Session <b class="t-med" id="timer">${mm}:${ss}</b></span><span class="t-meta nowrap">Read-along on · ¶4</span><span class="grow"></span>
        <button class="btn text" data-act="toast" data-msg="Paused">${ic('pause')}Pause ${kbd('Space')}</button><button class="btn secondary" data-act="toast" data-msg="Session ended · 18 min · 1 check answered">End session</button></div>
      <div class="scroll"><article class="paper">
        <div class="line g3 t-meta">${cchip(k)}<span>Lecture notes</span><span>·</span><span>Mon Nov 2</span><span class="grow"></span><span class="saved"><i class="dot d-ok"></i>Saved on this device</span></div>
        <h1>Wk 9 · Fluid balance &amp; I&amp;O</h1>
        <h2>Where the water is</h2>
        <div class="cols2">
          <figure class="figure"><svg viewBox="0 0 196 110" aria-hidden="true"><rect x="1" y="1" width="194" height="80" rx="6" fill="none" stroke="var(--line2)"/><rect x="1" y="1" width="128" height="80" rx="6" fill="color-mix(in srgb,var(--c1) 14%,transparent)" stroke="var(--c1)" stroke-opacity=".5"/><line x1="176" y1="1" x2="176" y2="81" stroke="var(--line2)"/><text x="12" y="22" font-size="11" fill="var(--quiet)" font-family="Inter,sans-serif">ICF · ⅔</text><text x="138" y="22" font-size="11" fill="var(--quiet)" font-family="Inter,sans-serif">ISF</text><text x="179" y="22" font-size="9" fill="var(--faint)" font-family="Inter,sans-serif">P</text><text x="1" y="102" font-size="11" fill="var(--faint)" font-family="Inter,sans-serif">ECF · ⅓ = interstitial + plasma</text></svg><span>Image · fluid compartments</span></figure>
          <ul><li>Total body water is about 60% of adult body weight</li><li>Intracellular fluid (ICF): about two thirds</li><li>Extracellular fluid (ECF): about one third<ul><li>interstitial ≈ ¾ of ECF, plasma ≈ ¼</li></ul></li></ul>
        </div>
        <h2>Intake and output</h2>
        <p class="reading">Intake is anything that enters as fluid: drinks, IV fluids, tube feeds, and foods that are liquid at room temperature, like gelatin or ice cream. Ice chips count as about half their volume.</p>
        <div class="ev-check"><span class="mark quiet" style="margin-top:3px"></span><div class="say">
          <div><b class="t-med">Check, in your own words.</b> Why does a patient on a diuretic need strict I&amp;O?</div>
          <textarea class="field" rows="2" aria-label="Your answer">They lose more fluid as urine, so if output runs far ahead of intake they get dry and their potassium can drop.</textarea>

        </div></div>

        <h2>Before Thursday</h2>

      </article></div>
    </div>
  </div></div>`;
}

/* 4 · Study plan proposal: confidence first */
function proposal(){
  const objs = ['Fluid balance &amp; I&amp;O','Medication administration','Vital signs','Asepsis','Med math'];
  const labels = ['Not yet','Shaky','OK','Solid'];
  const rated = objs.every((_,i)=>st.rates[i]!=null);
  const prop = [
    {day:'Tue',items:[{status:'todo',prio:3,title:'Oral liquid doses, 9 problems',link:['set','oral-liquid'],course:'nur',est:'20m',when:'Tue'},{status:'todo',prio:2,title:'Fluid terms, weakest first',link:['set','fluid-terms'],course:'nur',est:'15m',when:'Tue'}]},
    {day:'Wed',items:[{status:'todo',prio:3,title:'Sit the mock, timed',link:['set','exam3-mock'],course:'nur',est:'60m',when:'Wed'},{status:'todo',prio:1,title:'Re-read Wk 8, then explain it',link:['note','wk8'],course:'nur',est:'20m',when:'Wed'}]},
    {day:'Thu morning',items:[{status:'todo',prio:1,title:'Ten-card warm-up',link:['set','vitals'],course:'nur',est:'10m',when:'7:30 am'}]}
  ];
  return `<div class="page">${chead('nur','exams')}
  <div class="col" style="padding-top:var(--sp-10);gap:var(--sp-10)">
    <div class="stack g2"><div class="crumb"><a data-go="course/nur112/exams">Exams</a><span class="sep">/</span><span>Exam 3</span><span class="sep">/</span><span>Study plan</span></div>
      <div class="phead"><h1 class="t-title grow">A study plan for Exam 3</h1>${olink('job-status',null,'proposal · waiting for you')}</div>
      <div class="t-meta">E.V. drafted 9 sessions from your accuracy and the 5 objectives. Before you see them, tell her how sure you feel.</div></div>
    <section class="sec"><div class="sec-head"><h2 class="t-label">1 · How sure are you?</h2><span class="t-meta">${Object.keys(st.rates).length} of 5</span></div>
      ${objs.map((o,i)=>`<div class="wrow" style="cursor:default" ${cs('nur')}><span class="t">${o}</span><div class="seg">${labels.map((l,j)=>`<button class="${st.rates[i]===j?'on':''}" data-act="rate" data-i="${i}" data-j="${j}">${l}</button>`).join('')}</div></div>`).join('')}
    </section>
    <section class="sec"><div class="sec-head"><h2 class="t-label">2 · What she proposes</h2>${rated?'<span class="t-meta">5 sessions shown of 9 · 2 h 05 m</span>':''}</div>

  </div></div>`;
}

/* 10 · Practice mode: one problem, commit, then cited feedback */

    <div class="stage"><div class="inner">
      <div class="qcard">
        <div class="line g2 t-meta"><span>Problem 4 of 10</span><span>·</span><span>mg/kg/day, divided</span></div>
        <div class="t-read">A child weighs <b class="t-med">15 kg</b>. The order is amoxicillin <b class="t-med">20 mg/kg/day</b>, divided every 8 hours. You have an oral suspension of <b class="t-med">250 mg per 5 mL</b>. How many mL do you give per dose?</div>

/* 11 · Procedure set: recall the next step, then check */
function procedure(){
  const steps = ['Perform hand hygiene','Check glove size, expiry date and that the package is dry and sealed','Place the package on a clean, dry surface at waist height','Peel open the outer wrapper and remove the inner one','Open the inner wrapper touching only the folded outer edges','With the non-dominant hand, grasp the folded cuff of the dominant glove and pull it on','Slide gloved fingers under the cuff of the second glove and pull it on','Adjust the fingers, touching only sterile surfaces','Keep hands above the waist and in sight'];
  const opts = [[6,'Slide gloved fingers under the cuff of the second glove'],[5,'Grasp the folded cuff of the dominant glove with the bare hand and pull it on'],[7,'Adjust the fingers of both gloves']];
  const placed = st.procChecked ? 6 : 5;
  return `<div class="study">
    <div class="studybar"><button class="btn icon text" data-go="course/nur112/library" title="Leave">${ic('x')}</button><span class="t-med">Sterile gloving</span><span class="t-meta line g2">Procedure · 9 steps · ${cchip('nur')}</span><span class="grow"></span><span class="t-meta">${placed} of 9 placed</span><div class="bar"><i style="width:${placed/9*100}%"></i></div></div>
    <div class="stage"><div class="inner">
      <div class="ptrack">${steps.map((t,i)=>i<placed?`<div class="pstep"><span class="num ok">${i+1}</span><span class="${i===placed-1&&st.procChecked?'':'c-quiet'}">${t}</span></div>`
        : i===placed?`<div class="pstep slot"><span class="num">${i+1}</span><span class="ph">${st.procChecked?'What comes next?':st.procPick!=null?opts[st.procPick][1]:'What comes next?'}</span></div>`
        : `<div class="pstep todo"><span class="num">${i+1}</span><span>·  ·  ·</span></div>`).join('')}</div>
      ${st.procChecked?`<div class="reveal" style="border-top:0;padding-top:0">
          ${evline('<b>Right.</b> The bare hand only touches the folded cuff, the inside of the glove, so the outside stays sterile. '+olink('note','lab-glove','Skills lab · Sterile gloving · ¶2'))}
          <div class="line g3"><button class="btn primary" data-act="proc-next">Next step ${kbd('↵')}</button><span class="t-meta">Step 7 next · you missed it last time</span></div></div>`
      :`<div class="stack g3"><div class="flabel">Step 6 · type it, or pick one</div><input class="field" placeholder="In your own words…">
        <div class="opts">${opts.map((o,i)=>`<div class="optc ${st.procPick===i?'on':''}" data-act="proc-pick" data-i="${i}"><span>${o[1]}</span>${kbd(i+1)}</div>`).join('')}</div>
        <div class="line g3"><button class="btn primary" data-act="proc-check" ${st.procPick==null?'disabled':''}>Check ${kbd('↵')}</button><button class="btn text" title="Shows the step; logged">Just tell me ${kbd('⌥↵')}</button></div></div>`}
    </div></div></div>`;
}

    <section class="sys-sec"><h2>Components and states</h2><div class="specgrid">
      <div class="spec"><span class="lab">Buttons</span><div class="line g2" style="flex-wrap:wrap"><button class="btn primary">Start next ${kbd('S')}</button><button class="btn primary" disabled>Approve ${kbd('⌘↵')}</button></div><div class="line g2" style="flex-wrap:wrap"><button class="btn secondary">Ask for changes</button><button class="btn text">Just tell me</button><button class="btn icon secondary">${ic('left')}</button></div><div class="t-meta">Primary: one per screen. Disabled primary drops to an outline until its condition is met.</div></div>
      <div class="spec"><span class="lab">Filters · segmented · tabs</span><div class="filters"><button class="fchip on">All<span class="n">16</span></button><button class="fchip">${ic('cards')}Flashcards<span class="n">5</span></button></div><div class="seg"><button>Not yet</button><button class="on">Shaky</button><button>OK</button><button>Solid</button></div><nav class="tabs" ${cs('nur')}><a class="on">Overview</a><a>Plan<span class="n">6</span></a><a>Library<span class="n">10</span></a></nav></div>
      <div class="spec"><span class="lab">Field</span><input class="field" placeholder="Empty · placeholder"><input class="field" value="Focused" style="box-shadow:inset 0 0 0 1.5px var(--text)"><input class="field" value="6" disabled style="opacity:.7"></div>
      <div class="spec"><span class="lab">Plan status · priority</span><div class="line g4" style="flex-wrap:wrap;row-gap:8px">${['todo','prog','done','proposed','cancel'].map(s=>`<span class="line g2 t-meta nowrap">${status(s)}${{todo:'To do',prog:'Doing',done:'Done',proposed:'Proposed',cancel:'Put away'}[s]}</span>`).join('')}</div><div class="line g4">${[1,2,3].map(p=>`<span class="line g2 t-meta">${prio(p)}${['','Low','Medium','High'][p]}</span>`).join('')}</div></div>
      <div class="spec"><span class="lab">Job ring states</span><div class="line g4">${[['run',2,'Running'],['need',3,'Needs you'],['done',4,'Done'],['fail',0,'Failed']].map(([s,d,l])=>`<span class="stack g1 nowrap" style="align-items:center">${ring(4,d,s,28)}<span class="t-meta">${l}</span></span>`).join('')}</div></div>
      <div class="spec"><span class="lab">Measures</span>${meter([34,24,42])}<div class="pips">${'rrwrrwrrrw'.split('').map(c=>`<i class="${c}"></i>`).join('')}</div>${frac(WEAK[0])}<div class="bar"><i style="width:40%"></i></div><div class="t-meta">Readiness meter · practice pips · weak-spot fraction · progress bar. Status is only ever a dot, a meter or a ring.</div></div>
    </div></section>
  </div></div>`;
}

/* ================= Router ================= */
const area = document.getElementById('area'), side = document.getElementById('sidebar');
const ROUTES = [
  [/^today$/, today, 'today'], [/^item$/, item, 'today'], [/^ask$/, ask, 'ask'], [/^activity$/, activity, 'activity'],
  [/^library$/, library, 'library'], [/^notes$/, notesAll, 'notes'],
  [/^course\/(nur112|bio201)$/, id=>courseOverview(byId(id).key), m=>m],
  [/^course\/(nur112|bio201)\/plan$/, id=>coursePlan(byId(id).key), m=>m],
  [/^course\/(nur112|bio201)\/library$/, id=>courseLibrary(byId(id).key), m=>m],
  [/^course\/(nur112|bio201)\/notes$/, id=>courseNotes(byId(id).key), m=>m],
  [/^course\/nur112\/notes\/wk9$/, courseDoc, 'nur112'],
  [/^course\/(nur112|bio201)\/exams$/, id=>courseExams(byId(id).key), m=>m],
  [/^proposal$/, proposal, 'nur112'],
  [/^add-course$/, ()=>courseOverview('nur'), 'add', 'add'],
  [/^set$/, setPage, 'library'], [/^study$/, study, 'library'], [/^practice$/, practice, 'nur112'], [/^procedure$/, procedure, 'nur112'],
  [/^palette$/, today, 'today', 'palette'],
  [/^system$/, system, 'system'], [/^phone$/, phone, 'phone']
];
let lastHash = null;
function render(){
  const h = location.hash.slice(1) || 'today';
  const r = ROUTES.find(([re]) => re.test(h)) || ROUTES[0];
  const m = h.match(r[0]);
  if (h !== lastHash){ if(!/^course\/.*\/notes/.test(h)) st.folder = 'all'; lastHash = h; }
  const nav = typeof r[2]==='function' ? r[2](m[1]) : r[2];
  side.innerHTML = sidebar(nav);
  const scroll = area.querySelector('.page')?.scrollTop || 0;
  area.innerHTML = r[1](m[1]);
  if (st.keepScroll) { const p = area.querySelector('.page'); if (p) p.scrollTop = scroll; st.keepScroll = false; }
  document.getElementById('overlay')?.remove();
  if (r[3]==='palette' || st.overlay==='palette') openOverlay(paletteHTML());
  if (r[3]==='add') openOverlay(addCourseSheet());
}
function rerender(){ st.keepScroll = true; render(); }
function openOverlay(html){ document.getElementById('overlay')?.remove(); const d=document.createElement('div'); d.id='overlay'; d.innerHTML=html; document.getElementById('app').appendChild(d); }
function closeOverlay(){
  st.overlay = null; document.getElementById('overlay')?.remove();
  const h = location.hash.slice(1);
  if (h==='palette') history.replaceState(null,'','#today');
  if (h==='add-course') history.replaceState(null,'','#course/nur112');
  render();
}
function go(h){ if (location.hash.slice(1) === h) render(); else location.hash = h; }
function toast(msg){ document.querySelector('.toast')?.remove(); const t=document.createElement('div'); t.className='toast'; t.innerHTML=`<span>${msg}</span><button class="btn text" onclick="this.parentNode.remove()">Undo</button>`; document.getElementById('app').appendChild(t); setTimeout(()=>t.remove(),2600); }
function toggleTheme(){ const r=document.documentElement; r.dataset.theme = r.dataset.theme==='dark'?'light':'dark'; rerender(); }

const ACTS = {
  theme: toggleTheme,
  palette: () => { st.overlay='palette'; openOverlay(paletteHTML()); },
  'close-overlay': (el, e) => { if (e.target.closest('[data-stop]') && !el.matches('button')) return; closeOverlay(); },
  toast: el => toast(el.dataset.msg),
  accept: () => { st.suggest='accepted'; rerender(); toast('Added to today · 8:30 pm'); },
  sub: el => { const i=+el.dataset.i; st.subs[i]=!st.subs[i]; rerender(); },
  libtype: el => { st.libType=el.dataset.k; rerender(); },
  libcourse: el => { st.libCourse=el.dataset.k; rerender(); },
  folder: el => { st.folder=el.dataset.f; rerender(); },
  heroflip: () => { st.heroFlip=!st.heroFlip; rerender(); },
  hero: el => { st.heroIdx=(st.heroIdx+(+el.dataset.d)+TERMS.length)%TERMS.length; st.heroFlip=false; rerender(); },
  flip: () => { st.flipped=true; rerender(); },
  'next-card': () => { st.flipped=false; rerender(); toast('Card 3 of 8'); },
  commit: () => { st.committed=true; rerender(); },
  'proc-pick': el => { st.procPick=+el.dataset.i; rerender(); },
  'proc-check': () => { if (st.procPick===1){ st.procChecked=true; rerender(); } else toast('Not that one yet; it comes later. Try again.'); },
  'proc-next': () => { st.procChecked=false; st.procPick=null; rerender(); },
  rate: el => { st.rates[+el.dataset.i]=+el.dataset.j; rerender(); },
  approve: () => { toast('Plan approved · 9 items added to NUR 112 › Plan'); },
  swatch: el => { st.swatch=el.dataset.c; const sh=document.querySelector('.sheet'); if(sh){ sh.style.setProperty('--c',`var(${st.swatch})`); sh.querySelectorAll('.swatches button').forEach(b=>b.classList.toggle('on',b.dataset.c===st.swatch)); } },
  'add-course': () => { closeOverlay(); toast('PSY 210 added to your courses'); },
  noop: () => {}
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-go]');
  if (!el) return;
  if (el.dataset.act){ ACTS[el.dataset.act]?.(el, e); return; }
  e.preventDefault(); st.overlay = null; go(el.dataset.go);
});
document.addEventListener('keydown', e => {
  const typing = e.target.matches('input,textarea,[contenteditable="true"]');
  const h = location.hash.slice(1) || 'today';
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); ACTS.palette(); return; }
  if (e.key==='Escape'){ if (document.getElementById('overlay')) closeOverlay(); return; }
  if (typing) return;
  if (e.key==='\\'){ toggleTheme(); return; }
  if (e.key===' ' && h==='set'){ e.preventDefault(); ACTS.heroflip(); }
  if (e.key===' ' && h==='study'){ e.preventDefault(); ACTS.flip(); }
  if ((e.key==='ArrowRight'||e.key==='ArrowLeft') && h==='set'){ ACTS.hero({dataset:{d:e.key==='ArrowRight'?1:-1}}); }
  if (e.key==='s' && h==='today') go('practice');
  if (e.key==='a' && h==='today' && st.suggest==='pending') ACTS.accept();
});
setInterval(() => { st.timer++; const t=document.getElementById('timer'); if (t) t.textContent = String(Math.floor(st.timer/60)).padStart(2,'0')+':'+String(st.timer%60).padStart(2,'0'); }, 1000);
window.addEventListener('hashchange', () => { st.overlay=null; render(); });
render();

</script>
