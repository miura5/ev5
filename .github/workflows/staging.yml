name: staging
# Deploys the v5 staging Worker + synthetic D1, both named ev5-staging (CONTRACT §sec.account), on every merge to main and on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: staging

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  NAME: ev5-staging
  WRANGLER: wrangler@4.156.2

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      - run: npm run build
      - name: Create D1 if missing
        run: |
          npx --yes $WRANGLER d1 create "$NAME" || true
          npx --yes $WRANGLER d1 info "$NAME" --json | tee d1.json
          echo "DBID=$(node -p "JSON.parse(require('fs').readFileSync('d1.json','utf8')).uuid")" >> "$GITHUB_ENV"
      - name: Schema and synthetic seed
        run: |
          node -e "const f='wrangler.jsonc',s=require('fs').readFileSync(f,'utf8');require('fs').writeFileSync(f,s.replace('00000000-0000-0000-0000-000000000000',process.env.DBID))"
          npx --yes $WRANGLER d1 execute "$NAME" --remote --yes --file data/staging/schema.sql
          npx --yes $WRANGLER d1 execute "$NAME" --remote --yes --file data/staging/seed.sql
      - name: Deploy
        run: |
          set -o pipefail
          npx --yes $WRANGLER deploy --var COMMIT:${{ github.sha }} 2>&1 | tee deploy.log
          grep -o 'https://[^ ]*workers.dev' deploy.log | head -1 | tee url.txt
      - name: Worker secrets
        # GitHub secrets go to the Worker through stdin only: never a file, never the log (CONTRACT §hard.no-secrets-in-files).
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_STAGING }}
          TOKEN_APP: ${{ secrets.TOKEN_APP_STAGING }}
          TOKEN_SCHEDULE: ${{ secrets.TOKEN_SCHEDULE_STAGING }}
          TOKEN_EXECUTOR: ${{ secrets.TOKEN_EXECUTOR_STAGING }}
        run: |
          node -e "const k=['ANTHROPIC_API_KEY','TOKEN_APP','TOKEN_SCHEDULE','TOKEN_EXECUTOR'];if(k.some(n=>!process.env[n]))throw new Error('missing staging secret');process.stdout.write(JSON.stringify(Object.fromEntries(k.map(n=>[n,process.env[n]]))))" \
            | npx --yes $WRANGLER secret bulk --name "$NAME"
      - name: Health
        run: |
          U=$(cat url.txt); sleep 10
          echo "== $U/api/health"; curl -sS -i "$U/api/health"; echo
          echo "== $U/ (the built app)"; curl -sS -i "$U/" | head -20
