name: live
# Manual only, and gated by the "live" environment's required reviewers (CONTRACT §sec.account). The only workflow that names ev-live.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: live

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_LIVE }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  NAME: ev-live
  WRANGLER: wrangler@4.156.2

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      - run: npm run build
      - name: Point the config at the live Worker and its existing D1
        run: |
          npx --yes $WRANGLER d1 info "$NAME" --json | tee d1.json
          DBID=$(node -p "JSON.parse(require('fs').readFileSync('d1.json','utf8')).uuid")
          node -e "const f='wrangler.jsonc';let s=require('fs').readFileSync(f,'utf8');s=s.replaceAll('ev5-staging',process.env.NAME).replace('00000000-0000-0000-0000-000000000000',process.argv[1]).replace('\"staging\"','\"live\"');require('fs').writeFileSync(f,s)" "$DBID"
      - name: Deploy
        run: |
          set -o pipefail
          npx --yes $WRANGLER deploy --var COMMIT:${{ github.sha }} 2>&1 | tee deploy.log
          grep -o 'https://[^ ]*workers.dev' deploy.log | head -1 | tee url.txt
      - name: Health
        run: |
          U=$(cat url.txt); sleep 10
          curl -sS -i "$U/api/health"
