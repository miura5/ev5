name: gate5-e2e
# Gate 5's journeys on v5 staging (never live): reads and writes /api/v1 with the app token; each journey is a @playwright/test file in the Playwright Docker image; an unbuilt journey fails. Staging-dependent, so dispatch-only (CONTRACT §drift.checks: every batch runs the e2e journeys, i.e. dispatch per batch).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci --ignore-scripts
      - name: Find the staging Worker
        run: |
          SUB=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).result.subdomain")
          echo "E2E_URL=https://ev5-staging.$SUB.workers.dev" >> "$GITHUB_ENV"
      - name: Journeys
        env:
          E2E_TOKEN: ${{ secrets.TOKEN_APP_STAGING }}
        run: |
          curl -fsS "$E2E_URL/api/health"; echo
          e2e/gate5-docker.sh
