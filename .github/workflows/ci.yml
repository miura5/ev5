name: CI

on:
  pull_request:
  # The visual-baselines workflow starts CI this way after it commits (a GITHUB_TOKEN push starts no CI).
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that PR's older run. Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The tests run in parallel jobs; `checks` (the one required check) passes only when every one of them passed.
  # `npm run precheck` runs the same steps on a builder's machine before a push.
  node-tests:
    name: node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:node

  unit:
    name: unit ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/3

  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Phase 0 checks; the full PLAN §11 set replaces this list in Phase 1 (S-11 to S-15).
      - run: npx tsc -p .
      - run: npx vite build
      - run: npm run lint
      - run: npm run deps
      - run: npm run stylelint
      - run: npm run knip
      - run: node ops/record/cli.ts lint
      - run: node ops/record/cli.ts render --check
      - run: node ops/checks/cli.ts
      - run: node ops/generate/cli.ts --check

  checks:
    name: checks
    needs: [node-tests, unit, static, visual]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every check job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  visual:
    name: visual
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A pull request that only touches records, docs, ops tooling or workflows cannot move the gallery: the
      # job still reports success (checks waits for it) but skips the Docker run. Anything else runs it.
      - name: Can this change move the gallery?
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          run=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
            if ! git diff --name-only "$BASE" HEAD | grep -qvE '^(chart/|docs/|ops/|\.github/|design/|[^/]+\.md$)'; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "visual run: $run"
      - name: Baselines present?
        id: baselines
        if: steps.scope.outputs.run == 'true'
        run: |
          if ls e2e/baselines/*.png >/dev/null 2>&1; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::warning::No /kit baselines committed yet; run the visual-baselines workflow on this branch."; fi
      - if: steps.baselines.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - if: steps.baselines.outputs.present == 'true'
        run: npm ci
      - if: steps.baselines.outputs.present == 'true'
        run: e2e/visual-docker.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: test-results/
