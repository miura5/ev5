name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that PR's older run. Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Phase 0 checks; the full PLAN §11 set replaces this list in Phase 1 (S-11 to S-15).
      - run: npm test
      - run: npx tsc -p .
      - run: npx vite build
      - run: npm run lint
      - run: npm run deps
      - run: npm run stylelint
      - run: npm run knip
      - run: node ops/record/cli.ts lint
      - run: node ops/record/cli.ts render --check
      - run: node ops/checks/cli.ts
      - run: node ops/generate/cli.ts --check

  visual:
    name: visual
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Baselines present?
        id: baselines
        run: |
          if ls e2e/baselines/*.png >/dev/null 2>&1; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::warning::No /kit baselines committed yet; run the visual-baselines workflow on this branch."; fi
      - if: steps.baselines.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - if: steps.baselines.outputs.present == 'true'
        run: npm ci
      - if: steps.baselines.outputs.present == 'true'
        run: e2e/visual-docker.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: test-results/
