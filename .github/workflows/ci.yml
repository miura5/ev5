name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      # Phase 0 checks; the full PLAN §11 set replaces this list in Phase 1 (S-11 to S-15).
      - run: npm test
      - run: npx tsc -p .
      - run: npx vite build
      - run: npm run lint
      - run: npm run deps
      - run: npm run stylelint
      - run: npm run knip
      - run: node ops/record/cli.ts lint
      - run: node ops/record/cli.ts render --check
      - run: node ops/checks/cli.ts
