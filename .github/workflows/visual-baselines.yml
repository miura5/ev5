name: visual-baselines
# Regenerates the /kit visual baselines in the pinned Playwright Docker image and commits them to the chosen branch.
# Run it from the Actions tab on a PR branch (never main); CI then compares against what it committed.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse main
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Run this on a pull request branch, not main."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      - run: e2e/visual-docker.sh --update-snapshots
      - name: Commit baselines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/baselines
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "Regenerate /kit visual baselines (Playwright Docker image)"
            git push
            # A push made with GITHUB_TOKEN starts no workflow run, so start CI on the new commit by hand. Its
            # `checks` result lands on that commit, which is what the PR's required check reads.
            gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
            # GitHub can also queue a pull_request run on this sha that waits at action_required (an approval rule
            # for bot-pushed commits). It never starts, and its unfinished `checks` blocks the PR even though the
            # dispatched run above is green. Delete such runs; the dispatched run then stands as the check.
            sha=$(git rev-parse HEAD)
            for _ in $(seq 1 12); do
              ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=pull_request" \
                --jq '.workflow_runs[] | select(.status != "completed" or .conclusion == "action_required") | .id')
              for id in $ids; do
                echo "Deleting stuck pull_request run $id"
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" || true
              done
              [ -n "$ids" ] && break
              sleep 10
            done
          fi
